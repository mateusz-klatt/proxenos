name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Show the toolchain
        run: cargo --version --verbose

      - name: Format
        run: cargo fmt --all --check

      # Once as released, and once with the tools that exist only for the tests. Separate
      # steps, because a Windows shell reports only the exit status of its last command.
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Lint with the test tools
        run: cargo clippy --all-targets --locked --features test-tools -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@0.9.2

      # The build as released, without the test tools.
      - name: Test the release configuration
        run: cargo test --locked

      # Runs the tests. Each platform must cover every line it compiles. The MCP tests need
      # the `test-tools` feature, which a release is built without.
      - name: Test with full line coverage
        run: cargo llvm-cov --locked --features test-tools --lcov --output-path lcov.info --fail-under-lines 100

      # SonarCloud reads the Linux profile. The gate above is what holds every platform
      # to 100%; the paths in the other platforms' profiles would not resolve on the
      # Linux scanner.
      - name: Keep the Linux coverage profile for SonarCloud
        if: ${{ !cancelled() && matrix.os == 'ubuntu-26.04' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux
          path: lcov.info
          if-no-files-found: error
          retention-days: 7

  sonar:
    # The scan reads the profile the Linux job uploaded, so it waits for the checks, and
    # still runs when one of them failed so that the scan is not lost.
    needs: checks
    # Pull requests from forks get no secrets, so the scanner could not authenticate.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download the Linux coverage profile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-linux

      # Runs that Dependabot triggers get no repository secrets, so the scanner cannot
      # authenticate and would fail whatever the change. Those runs skip the analysis and
      # say so. main's own run after the merge has the token, so the gate on main still
      # decides.
      - name: Is the Sonar token available?
        id: sonar_token
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::error title=Sonar token missing::main's run must have SONAR_TOKEN; the analysis cannot be skipped here."
            exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Sonar skipped::SONAR_TOKEN is not available to this run, so the SonarCloud analysis was skipped. main's analysis after the merge still runs."
          fi

      - name: SonarCloud Scan
        if: ${{ steps.sonar_token.outputs.present == 'true' }}
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate
        if: ${{ steps.sonar_token.outputs.present == 'true' }}
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
