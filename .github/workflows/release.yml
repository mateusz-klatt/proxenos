name: release

# D11 release pipeline:
# - Pull requests touching release inputs, or workflow_dispatch with an empty
#   `version` input, run the six-target snapshot cross-builds, archives,
#   target-specific Syft SBOMs and checksums with no secrets and read-only tokens.
# - A real release starts ONLY via workflow_dispatch on protected `main` with a
#   non-empty `version` input (e.g. 0.1.0). There is no tag-push trigger: only
#   reviewed workflow YAML on `main` can request the `release` environment.
# - The pipeline never pushes a git tag. `publish` creates a draft GitHub
#   release for `v<version>` targeting the dispatched commit; GitHub creates the
#   tag only when the owner publishes the draft.
on:
  pull_request:
    branches: [main]
    paths:
      - '.goreleaser.yaml'
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without leading v (e.g. 0.1.0). Leave empty for a snapshot build.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' && 'certum-signing' || format('release-snapshot-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.version != '') }}

env:
  # Repository-pinned SHA-256 digests for downloaded release tools (tarball + binary).
  GORELEASER_VERSION: v2.20.0
  GORELEASER_TARBALL_SHA256_LINUX_AMD64: d2483159e6007f814132cb56635ad30a70013dbeb813d6033a7e01adf6ae108c
  GORELEASER_SHA256_LINUX_AMD64: d7ea8864f20f2cb1625ca64eb07e5d71fcb75475cb18d0045631098974bd0796
  GORELEASER_TARBALL_SHA256_DARWIN_ALL: b4f0702bcb2aad05bd13af5ac69ec94d84270dce59b917e7a8c446c974e29372
  GORELEASER_SHA256_DARWIN_ALL: a8130ffe0c8d4fdcebc3bd62f51693bc928d2382aa74b82a7fd9fa7de5138b79
  SYFT_VERSION: v1.54.0
  SYFT_TARBALL_SHA256_LINUX_AMD64: 54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860
  SYFT_SHA256_LINUX_AMD64: d46a9a61a6ae3d367f0a03748c5e9c59253e586c4388ab26ddcacebc2efa0d92
  SYFT_TARBALL_SHA256_DARWIN_ARM64: 7e0bdad94c569fc6d5785c9a657bbae3d4c4e140ccb5eace3d0b5b6bc2b6dbcf
  SYFT_SHA256_DARWIN_ARM64: 835607cdfbdbfc59335b0beadeefc47aa6aab7d3b403c11cfa65627d92a27f61
  COSIGN_VERSION: v3.1.4
  COSIGN_SHA256_LINUX_AMD64: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa

jobs:
  # ---------------------------------------------------------------------------
  # Snapshot cross-build path (PR or workflow_dispatch with empty version)
  # ---------------------------------------------------------------------------
  snapshot-darwin:
    name: Snapshot (macOS cross-builds)
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.version == '')
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.17.1'
          use-cache: false

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-zigbuild@0.24.1,cargo-auditable@0.7.7

      - name: Install verified goreleaser and syft binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/tools"

          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Darwin_all.tar.gz" \
            -o "$RUNNER_TEMP/goreleaser_Darwin_all.tar.gz"
          printf '%s  %s\n' "$GORELEASER_TARBALL_SHA256_DARWIN_ALL" "$RUNNER_TEMP/goreleaser_Darwin_all.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/goreleaser_Darwin_all.tar.gz" -C "$RUNNER_TEMP/tools" goreleaser
          printf '%s  %s\n' "$GORELEASER_SHA256_DARWIN_ALL" "$RUNNER_TEMP/tools/goreleaser" | shasum -a 256 -c -
          chmod 0755 "$RUNNER_TEMP/tools/goreleaser"

          syft_ver="${SYFT_VERSION#v}"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${syft_ver}_darwin_arm64.tar.gz" \
            -o "$RUNNER_TEMP/syft_darwin_arm64.tar.gz"
          printf '%s  %s\n' "$SYFT_TARBALL_SHA256_DARWIN_ARM64" "$RUNNER_TEMP/syft_darwin_arm64.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/syft_darwin_arm64.tar.gz" -C "$RUNNER_TEMP/tools" syft
          printf '%s  %s\n' "$SYFT_SHA256_DARWIN_ARM64" "$RUNNER_TEMP/tools/syft" | shasum -a 256 -c -
          chmod 0755 "$RUNNER_TEMP/tools/syft"

          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          cargo --version --verbose
          zig version
          cargo-zigbuild --version
          "$RUNNER_TEMP/tools/syft" version
          "$RUNNER_TEMP/tools/goreleaser" --version

      - name: Build macOS snapshot archives and SBOMs
        shell: bash
        env:
          PROXENOS_BUILD_GROUP: darwin
        run: goreleaser release --snapshot --clean --parallelism=1

      - name: Verify macOS binaries, archive contents and SPDX crate metadata
        shell: bash
        run: |
          set -euo pipefail
          lipo -archs dist/proxenos-darwin_x86_64-apple-darwin/proxenos | grep -Fx 'x86_64'
          lipo -archs dist/proxenos-darwin_aarch64-apple-darwin/proxenos | grep -Fx 'arm64'
          ./dist/proxenos-darwin_aarch64-apple-darwin/proxenos --version | grep -E '^proxenos '
          python3 -I - <<'PY'
          import json
          from pathlib import Path
          import tarfile

          dist = Path("dist")
          archives = sorted(dist.glob("proxenos_*_darwin_*.tar.gz"))
          sboms = sorted(dist.glob("proxenos_*_darwin_*.tar.gz.sbom.json"))
          assert len(archives) == 2, f"expected 2 darwin archives, got {archives}"
          assert len(sboms) == 2, f"expected 2 darwin SBOMs, got {sboms}"
          for archive in archives:
              with tarfile.open(archive, "r:gz") as tf:
                  names = sorted(m.name for m in tf.getmembers())
              assert names == ["LICENSE", "NOTICE", "proxenos"], f"{archive.name}: unexpected members {names}"
          for sbom in sboms:
              doc = json.loads(sbom.read_text())
              pkgs = {(p.get("name"), p.get("versionInfo")) for p in doc.get("packages", [])}
              assert ("rmcp", "3.11.0") in pkgs, f"{sbom.name}: missing rmcp 3.11.0 in SPDX packages"
              assert len(pkgs) >= 10, f"{sbom.name}: unexpectedly few SPDX packages ({len(pkgs)})"
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: snapshot-darwin-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/proxenos_*_darwin_*.tar.gz
            dist/proxenos_*_darwin_*.tar.gz.sbom.json
          if-no-files-found: error
          retention-days: 1

  snapshot-linux-windows:
    name: Snapshot (Linux musl & Windows cross-builds)
    needs: snapshot-darwin
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.version == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.snapshot-darwin.outputs.artifact-id }}
          path: ${{ runner.temp }}/macos-dist

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.17.1'
          use-cache: false

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-zigbuild@0.24.1,cargo-auditable@0.7.7

      - name: Install verified goreleaser and syft binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools"

          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz" \
            -o "$RUNNER_TEMP/goreleaser_Linux_x86_64.tar.gz"
          printf '%s  %s\n' "$GORELEASER_TARBALL_SHA256_LINUX_AMD64" "$RUNNER_TEMP/goreleaser_Linux_x86_64.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/goreleaser_Linux_x86_64.tar.gz" -C "$RUNNER_TEMP/tools" goreleaser
          printf '%s  %s\n' "$GORELEASER_SHA256_LINUX_AMD64" "$RUNNER_TEMP/tools/goreleaser" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/tools/goreleaser"

          syft_ver="${SYFT_VERSION#v}"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${syft_ver}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/syft_linux_amd64.tar.gz"
          printf '%s  %s\n' "$SYFT_TARBALL_SHA256_LINUX_AMD64" "$RUNNER_TEMP/syft_linux_amd64.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/syft_linux_amd64.tar.gz" -C "$RUNNER_TEMP/tools" syft
          printf '%s  %s\n' "$SYFT_SHA256_LINUX_AMD64" "$RUNNER_TEMP/tools/syft" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/tools/syft"

          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          cargo --version --verbose
          zig version
          cargo-zigbuild --version
          "$RUNNER_TEMP/tools/syft" version
          "$RUNNER_TEMP/tools/goreleaser" --version

      - name: Build Linux musl and Windows snapshot archives, SBOMs and checksums
        shell: bash
        env:
          PROXENOS_BUILD_GROUP: linux-windows
          PROXENOS_MACOS_DIST: ${{ runner.temp }}/macos-dist
        run: goreleaser release --snapshot --clean --parallelism=1

      - name: Verify static Linux binaries, Windows PE architectures, SBOMs and full checksums
        shell: bash
        env:
          PROXENOS_MACOS_DIST: ${{ runner.temp }}/macos-dist
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            bin="dist/proxenos_${target}/proxenos"
            if readelf -l "$bin" | grep -q 'INTERP'; then
              echo "::error::$bin is dynamically linked (PT_INTERP present)"
              exit 1
            fi
          done
          readelf -h dist/proxenos_x86_64-unknown-linux-musl/proxenos | grep -q 'X86-64'
          readelf -h dist/proxenos_aarch64-unknown-linux-musl/proxenos | grep -q 'AArch64'
          ./dist/proxenos_x86_64-unknown-linux-musl/proxenos --version | grep -E '^proxenos '
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import struct
          import tarfile
          import zipfile

          def pe_machine(path: Path) -> int:
              data = path.read_bytes()
              assert data[:2] == b"MZ", f"{path}: missing MZ header"
              pe_offset = struct.unpack_from("<I", data, 0x3C)[0]
              assert data[pe_offset : pe_offset + 4] == b"PE\x00\x00", f"{path}: missing PE signature"
              return struct.unpack_from("<H", data, pe_offset + 4)[0]

          assert pe_machine(Path("dist/proxenos_x86_64-pc-windows-gnu/proxenos.exe")) == 0x8664
          assert pe_machine(Path("dist/proxenos_aarch64-pc-windows-gnullvm/proxenos.exe")) == 0xAA64

          dist = Path("dist")
          macos_dist = Path(os.environ["PROXENOS_MACOS_DIST"])

          for archive in sorted(dist.glob("proxenos_*_linux_*.tar.gz")):
              with tarfile.open(archive, "r:gz") as tf:
                  names = sorted(m.name for m in tf.getmembers())
              assert names == ["LICENSE", "NOTICE", "proxenos"], f"{archive.name}: unexpected members {names}"

          for archive in sorted(dist.glob("proxenos_*_windows_*.zip")):
              with zipfile.ZipFile(archive) as zf:
                  names = sorted(zf.namelist())
              assert names == ["LICENSE", "NOTICE", "proxenos.exe"], f"{archive.name}: unexpected members {names}"

          sbom_files = sorted(dist.glob("*.sbom.json")) + sorted(macos_dist.glob("*.sbom.json"))
          assert len(sbom_files) == 6, f"expected 6 SBOMs, got {sbom_files}"
          for sbom in sbom_files:
              doc = json.loads(sbom.read_text())
              pkgs = {(p.get("name"), p.get("versionInfo")) for p in doc.get("packages", [])}
              pkg_names = {p[0] for p in pkgs}
              assert ("rmcp", "3.11.0") in pkgs, f"{sbom.name}: missing rmcp 3.11.0 in SPDX packages"
              assert len(pkgs) >= 10, f"{sbom.name}: unexpectedly few SPDX packages ({len(pkgs)})"
              if "_windows_" in sbom.name:
                  assert "windows-sys" in pkg_names, f"{sbom.name}: expected target-specific windows-sys crate"
              elif "_linux_" in sbom.name:
                  assert "windows-sys" not in pkg_names, f"{sbom.name}: unexpected windows-sys crate in Linux SBOM"

          lines = [line.strip() for line in (dist / "checksums.txt").read_text().splitlines() if line.strip()]
          assert len(lines) == 12, f"expected 12 checksum subjects (6 archives + 6 SBOMs), got {len(lines)}"
          for line in lines:
              digest, name = line.split()
              candidate = dist / name
              if not candidate.exists():
                  candidate = macos_dist / name
              assert candidate.is_file(), f"missing checksum subject {name}"
              actual = hashlib.sha256(candidate.read_bytes()).hexdigest()
              assert actual == digest, f"checksum mismatch for {name}"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Snapshot build verified\n\n")
              summary.write("All 6 targets built with `cargo-auditable`, archived, cataloged with Syft (crate metadata verified), and checksummed in `checksums.txt` (12 subjects).\n\n")
              summary.write("```text\n" + "\n".join(lines) + "\n```\n")
          PY

  # ---------------------------------------------------------------------------
  # Release path (workflow_dispatch on protected main with non-empty version)
  # ---------------------------------------------------------------------------
  check-release:
    name: Verify main ref, Cargo.toml version and unused release version
    if: github.repository == 'mateusz-klatt/proxenos' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact main ref, Cargo.toml match, and no existing tag or published release
        id: check
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mateusz-klatt/proxenos"
          test "$GITHUB_REF" = "refs/heads/main"
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import tomllib
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = "mateusz-klatt/proxenos"
          version = os.environ["INPUT_VERSION"]
          token = os.environ["GITHUB_TOKEN"]

          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", version):
              raise SystemExit(
                  f"version input must be a SemVer string without leading 'v' (e.g. 0.1.0), got {version!r}"
              )
          cargo = tomllib.loads(Path("Cargo.toml").read_text())
          cargo_version = cargo["package"]["version"]
          if cargo_version != version:
              raise SystemExit(
                  f"Cargo.toml package.version ({cargo_version!r}) does not match input version {version!r}"
              )

          tag = f"v{version}"
          api_base = "https://api.github.com"

          def api_get(url: str) -> tuple[int, dict | list | None]:
              req = urllib.request.Request(url, method="GET")
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status, json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as err:
                  if err.code == 404:
                      return 404, None
                  raise

          # 1. Fail early if git tag refs/tags/v<version> already exists.
          status, _ = api_get(f"{api_base}/repos/{repo}/git/ref/tags/{urllib.parse.quote(tag, safe='')}")
          if status != 404:
              raise SystemExit(f"Tag {tag} already exists in {repo}")

          # 2. Fail early if any release visible to this token already exists for v<version>.
          #    Note: GitHub hides drafts from contents:read tokens; publish (contents:write)
          #    re-checks for both drafts and published releases before cosign/provenance.
          page = 1
          while True:
              status, batch = api_get(f"{api_base}/repos/{repo}/releases?per_page=100&page={page}")
              assert status == 200 and isinstance(batch, list)
              if not batch:
                  break
              matches = [r for r in batch if r.get("tag_name") == tag]
              if matches:
                  raise SystemExit(f"Release(s) already exist for {tag}: {[r.get('id') for r in matches]}")
              if len(batch) < 100:
                  break
              page += 1

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"tag={tag}\n")
              out.write(f"version={version}\n")
          PY

  signer:
    name: Build pinned Certum signer
    needs: check-release
    if: github.repository == 'mateusz-klatt/proxenos' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Le-Syl21/ssign
          ref: f7ba7b2360a3e40bb8aa062d244d95c62a743b90 # v0.1.8, MIT
          path: ssign
          persist-credentials: false

      - name: Build ssign without credentials
        id: build
        working-directory: ssign
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 build --release --locked
          digest="$(sha256sum target/release/ssign | awk '{print $1}')"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          printf '`ssign` build SHA-256 (for transit integrity): `%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: certum-signer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ssign/target/release/ssign
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: Build unsigned macOS binaries
    needs: check-release
    if: github.repository == 'mateusz-klatt/proxenos' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      amd64-sha256: ${{ steps.build.outputs.amd64-sha256 }}
      arm64-sha256: ${{ steps.build.outputs.arm64-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.17.1'
          use-cache: false

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-zigbuild@0.24.1,cargo-auditable@0.7.7

      - name: Install verified goreleaser binary
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/tools"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Darwin_all.tar.gz" \
            -o "$RUNNER_TEMP/goreleaser_Darwin_all.tar.gz"
          printf '%s  %s\n' "$GORELEASER_TARBALL_SHA256_DARWIN_ALL" "$RUNNER_TEMP/goreleaser_Darwin_all.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/goreleaser_Darwin_all.tar.gz" -C "$RUNNER_TEMP/tools" goreleaser
          printf '%s  %s\n' "$GORELEASER_SHA256_DARWIN_ALL" "$RUNNER_TEMP/tools/goreleaser" | shasum -a 256 -c -
          chmod 0755 "$RUNNER_TEMP/tools/goreleaser"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          cargo --version --verbose
          zig version
          cargo-zigbuild --version
          "$RUNNER_TEMP/tools/goreleaser" --version

      - name: Build unsigned macOS binaries without credentials
        id: build
        shell: bash
        env:
          GORELEASER_CURRENT_TAG: ${{ needs.check-release.outputs.tag }}
          PROXENOS_BUILD_GROUP: darwin
          RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
        # No git tag exists before draft publication, so --skip=validate skips
        # git-describe exact-tag validation while GORELEASER_CURRENT_TAG pins
        # the release version and git status --porcelain checks tree cleanliness.
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          goreleaser build --clean --parallelism=1 --skip=validate
          lipo -archs dist/proxenos-darwin_x86_64-apple-darwin/proxenos | grep -Fx 'x86_64'
          lipo -archs dist/proxenos-darwin_aarch64-apple-darwin/proxenos | grep -Fx 'arm64'
          test "$(./dist/proxenos-darwin_aarch64-apple-darwin/proxenos --version)" = "proxenos $RELEASE_VERSION"
          echo "amd64-sha256=$(shasum -a 256 dist/proxenos-darwin_x86_64-apple-darwin/proxenos | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "arm64-sha256=$(shasum -a 256 dist/proxenos-darwin_aarch64-apple-darwin/proxenos | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: unsigned-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/proxenos-darwin_x86_64-apple-darwin/proxenos
            dist/proxenos-darwin_aarch64-apple-darwin/proxenos
          if-no-files-found: error
          retention-days: 1

  build-linux-windows:
    name: Build static Linux and unsigned Windows binaries
    needs: check-release
    if: github.repository == 'mateusz-klatt/proxenos' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      linux-artifact-id: ${{ steps.upload-linux.outputs.artifact-id }}
      windows-artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
      linux-amd64-sha256: ${{ steps.verify.outputs.linux-amd64-sha256 }}
      linux-arm64-sha256: ${{ steps.verify.outputs.linux-arm64-sha256 }}
      windows-amd64-sha256: ${{ steps.verify.outputs.windows-amd64-sha256 }}
      windows-arm64-sha256: ${{ steps.verify.outputs.windows-arm64-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.17.1'
          use-cache: false

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-zigbuild@0.24.1,cargo-auditable@0.7.7

      - name: Install verified goreleaser binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/goreleaser/goreleaser/releases/download/${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz" \
            -o "$RUNNER_TEMP/goreleaser_Linux_x86_64.tar.gz"
          printf '%s  %s\n' "$GORELEASER_TARBALL_SHA256_LINUX_AMD64" "$RUNNER_TEMP/goreleaser_Linux_x86_64.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/goreleaser_Linux_x86_64.tar.gz" -C "$RUNNER_TEMP/tools" goreleaser
          printf '%s  %s\n' "$GORELEASER_SHA256_LINUX_AMD64" "$RUNNER_TEMP/tools/goreleaser" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/tools/goreleaser"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          cargo --version --verbose
          zig version
          cargo-zigbuild --version
          "$RUNNER_TEMP/tools/goreleaser" --version

      - name: Build Linux musl and unsigned Windows binaries without credentials
        shell: bash
        env:
          GORELEASER_CURRENT_TAG: ${{ needs.check-release.outputs.tag }}
          PROXENOS_BUILD_GROUP: linux-windows
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          goreleaser build --clean --parallelism=1 --skip=validate

      - name: Verify static Linux binaries, Windows PE headers and output digests
        id: verify
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            bin="dist/proxenos_${target}/proxenos"
            if readelf -l "$bin" | grep -q 'INTERP'; then
              echo "::error::$bin is dynamically linked (PT_INTERP present)"
              exit 1
            fi
          done
          readelf -h dist/proxenos_x86_64-unknown-linux-musl/proxenos | grep -q 'X86-64'
          readelf -h dist/proxenos_aarch64-unknown-linux-musl/proxenos | grep -q 'AArch64'
          test "$(./dist/proxenos_x86_64-unknown-linux-musl/proxenos --version)" = "proxenos $RELEASE_VERSION"
          python3 -I - <<'PY'
          from pathlib import Path
          import struct

          def pe_machine(path: Path) -> int:
              data = path.read_bytes()
              assert data[:2] == b"MZ"
              off = struct.unpack_from("<I", data, 0x3C)[0]
              assert data[off : off + 4] == b"PE\x00\x00"
              return struct.unpack_from("<H", data, off + 4)[0]

          assert pe_machine(Path("dist/proxenos_x86_64-pc-windows-gnu/proxenos.exe")) == 0x8664
          assert pe_machine(Path("dist/proxenos_aarch64-pc-windows-gnullvm/proxenos.exe")) == 0xAA64
          PY
          echo "linux-amd64-sha256=$(sha256sum dist/proxenos_x86_64-unknown-linux-musl/proxenos | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "linux-arm64-sha256=$(sha256sum dist/proxenos_aarch64-unknown-linux-musl/proxenos | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "windows-amd64-sha256=$(sha256sum dist/proxenos_x86_64-pc-windows-gnu/proxenos.exe | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "windows-arm64-sha256=$(sha256sum dist/proxenos_aarch64-pc-windows-gnullvm/proxenos.exe | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-linux
        with:
          name: linux-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/proxenos_x86_64-unknown-linux-musl/proxenos
            dist/proxenos_aarch64-unknown-linux-musl/proxenos
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-windows
        with:
          name: unsigned-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/proxenos_x86_64-pc-windows-gnu/proxenos.exe
            dist/proxenos_aarch64-pc-windows-gnullvm/proxenos.exe
          if-no-files-found: error
          retention-days: 1

  sign-macos:
    name: Sign and notarize macOS binaries
    needs: [check-release, build-macos]
    if: github.repository == 'mateusz-klatt/proxenos' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: macos-latest
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      amd64-sha256: ${{ steps.sign.outputs.amd64-sha256 }}
      arm64-sha256: ${{ steps.sign.outputs.arm64-sha256 }}
    steps:
      - name: Verify exact repository and main ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mateusz-klatt/proxenos"
          test "$GITHUB_REF" = "refs/heads/main"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-macos.outputs.artifact-id }}
          path: ${{ runner.temp }}/macos-unsigned

      - name: Verify unsigned digests, sign with Developer ID and notarize via Apple notarytool
        id: sign
        shell: bash
        env:
          EXPECTED_AMD64_SHA256: ${{ needs.build-macos.outputs.amd64-sha256 }}
          EXPECTED_ARM64_SHA256: ${{ needs.build-macos.outputs.arm64-sha256 }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          set -euo pipefail
          for credential in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_ISSUER_ID MACOS_NOTARY_KEY_ID MACOS_NOTARY_KEY; do
            if [ -z "${!credential}" ]; then
              echo "::error::$credential is empty"
              exit 1
            fi
          done

          test "$(find "$RUNNER_TEMP/macos-unsigned" ! -type d | LC_ALL=C sort)" = "$(printf '%s\n' "$RUNNER_TEMP/macos-unsigned/proxenos-darwin_aarch64-apple-darwin/proxenos" "$RUNNER_TEMP/macos-unsigned/proxenos-darwin_x86_64-apple-darwin/proxenos")"
          printf '%s  %s\n' "$EXPECTED_AMD64_SHA256" "$RUNNER_TEMP/macos-unsigned/proxenos-darwin_x86_64-apple-darwin/proxenos" | shasum -a 256 -c -
          printf '%s  %s\n' "$EXPECTED_ARM64_SHA256" "$RUNNER_TEMP/macos-unsigned/proxenos-darwin_aarch64-apple-darwin/proxenos" | shasum -a 256 -c -

          IDENTITY="Developer ID Application: Mateusz Klatt (26MP7QQP95)"
          KEYCHAIN_PASS="$(openssl rand -hex 24)"
          trap 'security delete-keychain "$RUNNER_TEMP/proxenos-signing.keychain-db" >/dev/null 2>&1 || true; rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"' EXIT

          python3 -I - <<'PY'
          import base64
          import os
          from pathlib import Path

          def write_owner_only(path: Path, data: bytes) -> None:
              fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              try:
                  os.fchmod(fd, 0o600)
                  os.write(fd, data)
              finally:
                  os.close(fd)

          rt = Path(os.environ["RUNNER_TEMP"])
          write_owner_only(rt / "developer-id.p12", base64.b64decode(os.environ["MACOS_SIGN_P12"]))
          write_owner_only(rt / "AuthKey.p8", base64.b64decode(os.environ["MACOS_NOTARY_KEY"]))
          PY

          security create-keychain -p "$KEYCHAIN_PASS" "$RUNNER_TEMP/proxenos-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/proxenos-signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$RUNNER_TEMP/proxenos-signing.keychain-db"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$MACOS_SIGN_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/proxenos-signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$RUNNER_TEMP/proxenos-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/proxenos-signing.keychain-db"
          security find-identity -v -p codesigning "$RUNNER_TEMP/proxenos-signing.keychain-db" | grep -F "$IDENTITY"

          for target in proxenos-darwin_x86_64-apple-darwin proxenos-darwin_aarch64-apple-darwin; do
            binary="$RUNNER_TEMP/macos-unsigned/$target/proxenos"
            zip_path="$RUNNER_TEMP/notarize-${target}.zip"
            notary_json="$RUNNER_TEMP/notary-${target}.json"
            chmod +x "$binary"
            codesign --force --options runtime --timestamp --keychain "$RUNNER_TEMP/proxenos-signing.keychain-db" --sign "$IDENTITY" "$binary"
            codesign --verify --strict --verbose=2 "$binary"
            ditto -c -k --keepParent "$binary" "$zip_path"
            xcrun notarytool submit "$zip_path" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$MACOS_NOTARY_KEY_ID" \
              --issuer "$MACOS_NOTARY_ISSUER_ID" \
              --wait \
              --timeout 20m \
              --output-format json > "$notary_json"
            python3 -I - "$target" "$notary_json" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          target, json_path = sys.argv[1], Path(sys.argv[2])
          data = json.loads(json_path.read_text())
          status = data.get("status")
          sub_id = data.get("id", "<unknown>")
          if status != "Accepted":
              raise SystemExit(f"Apple notarization did not accept {target}: status={status!r}, id={sub_id!r}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Apple accepted notarization for `{target}` (submission `{sub_id}`)\n\n")
          PY
          done

          echo "amd64-sha256=$(shasum -a 256 "$RUNNER_TEMP/macos-unsigned/proxenos-darwin_x86_64-apple-darwin/proxenos" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "arm64-sha256=$(shasum -a 256 "$RUNNER_TEMP/macos-unsigned/proxenos-darwin_aarch64-apple-darwin/proxenos" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: signed-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/macos-unsigned/proxenos-darwin_x86_64-apple-darwin/proxenos
            ${{ runner.temp }}/macos-unsigned/proxenos-darwin_aarch64-apple-darwin/proxenos
          if-no-files-found: error
          retention-days: 1

  verify-macos:
    name: Verify bare signed macOS binaries before Windows signing
    needs: [check-release, sign-macos]
    if: github.repository == 'mateusz-klatt/proxenos' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: macos-latest
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign-macos.outputs.artifact-id }}
          path: ${{ runner.temp }}/macos-signed

      - name: Verify signed digests, signatures, notarization and arm64 execution
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
          EXPECTED_AMD64_SHA256: ${{ needs.sign-macos.outputs.amd64-sha256 }}
          EXPECTED_ARM64_SHA256: ${{ needs.sign-macos.outputs.arm64-sha256 }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cd "$RUNNER_TEMP/macos-signed"
          test "$(find . ! -type d | LC_ALL=C sort)" = "$(printf '%s\n' ./proxenos-darwin_aarch64-apple-darwin/proxenos ./proxenos-darwin_x86_64-apple-darwin/proxenos)"
          printf '%s  %s\n' "$EXPECTED_AMD64_SHA256" "./proxenos-darwin_x86_64-apple-darwin/proxenos" | shasum -a 256 -c -
          printf '%s  %s\n' "$EXPECTED_ARM64_SHA256" "./proxenos-darwin_aarch64-apple-darwin/proxenos" | shasum -a 256 -c -
          for target in proxenos-darwin_x86_64-apple-darwin proxenos-darwin_aarch64-apple-darwin; do
            binary="./$target/proxenos"
            chmod +x "$binary"
            printf '\n### %s\n\n```text\n' "$target" >> "$GITHUB_STEP_SUMMARY"
            codesign --verify --strict --verbose=2 "$binary" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            codesign -dv --verbose=4 "$binary" 2>&1 | tee "$RUNNER_TEMP/macos-signature.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -Fx 'Authority=Developer ID Application: Mateusz Klatt (26MP7QQP95)' "$RUNNER_TEMP/macos-signature.txt"
            grep -Fx 'TeamIdentifier=26MP7QQP95' "$RUNNER_TEMP/macos-signature.txt"
            grep -E '^CodeDirectory .*flags=.*\(.*runtime.*\)' "$RUNNER_TEMP/macos-signature.txt"
            grep -E '^Timestamp=.+$' "$RUNNER_TEMP/macos-signature.txt"
            spctl -a -vvv -t install "$binary" 2>&1 | tee "$RUNNER_TEMP/macos-assessment.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -Fx "$binary: accepted" "$RUNNER_TEMP/macos-assessment.txt"
            grep -Fx 'source=Notarized Developer ID' "$RUNNER_TEMP/macos-assessment.txt"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          done
          actual="$(./proxenos-darwin_aarch64-apple-darwin/proxenos --version)"
          test "$actual" = "proxenos $RELEASE_VERSION"
          printf '\n### macOS arm64 execution (pre-packaging)\n\n```text\n%s\n```\n' "$actual" >> "$GITHUB_STEP_SUMMARY"

  sign-windows:
    name: Sign Windows binaries with Certum
    needs: [check-release, signer, build-linux-windows, verify-macos]
    if: github.repository == 'mateusz-klatt/proxenos' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      amd64-sha256: ${{ steps.sign.outputs.amd64-sha256 }}
      arm64-sha256: ${{ steps.sign.outputs.arm64-sha256 }}
    steps:
      - name: Verify exact repository and main ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mateusz-klatt/proxenos"
          test "$GITHUB_REF" = "refs/heads/main"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.signer.outputs.artifact-id }}
          path: ${{ runner.temp }}/signer

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-linux-windows.outputs.windows-artifact-id }}
          path: ${{ runner.temp }}/windows-unsigned

      - name: Verify signer and unsigned binary handoff digests (transit integrity) and sign both Windows binaries
        id: sign
        shell: bash
        env:
          EXPECTED_SIGNER_SHA256: ${{ needs.signer.outputs.sha256 }}
          EXPECTED_AMD64_SHA256: ${{ needs.build-linux-windows.outputs.windows-amd64-sha256 }}
          EXPECTED_ARM64_SHA256: ${{ needs.build-linux-windows.outputs.windows-arm64-sha256 }}
          PROXENOS_WINDOWS_SIGNER: ${{ runner.temp }}/signer/ssign
          XDG_RUNTIME_DIR: ${{ runner.temp }}/certum-signing-step
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          set -euo pipefail
          trap 'test -n "${RUNNER_TEMP:-}" && rm -rf "$RUNNER_TEMP/certum-signing-step"' EXIT
          printf '%s  %s\n' "$EXPECTED_SIGNER_SHA256" "$PROXENOS_WINDOWS_SIGNER" | sha256sum --check --strict
          test "$(find "$RUNNER_TEMP/windows-unsigned" ! -type d | LC_ALL=C sort)" = "$(printf '%s\n' "$RUNNER_TEMP/windows-unsigned/proxenos_aarch64-pc-windows-gnullvm/proxenos.exe" "$RUNNER_TEMP/windows-unsigned/proxenos_x86_64-pc-windows-gnu/proxenos.exe")"
          printf '%s  %s\n' "$EXPECTED_AMD64_SHA256" "$RUNNER_TEMP/windows-unsigned/proxenos_x86_64-pc-windows-gnu/proxenos.exe" | sha256sum --check --strict
          printf '%s  %s\n' "$EXPECTED_ARM64_SHA256" "$RUNNER_TEMP/windows-unsigned/proxenos_aarch64-pc-windows-gnullvm/proxenos.exe" | sha256sum --check --strict
          python3 -I - <<'PY'
          import os
          import stat
          import subprocess
          import sys

          signer = os.environ.get("PROXENOS_WINDOWS_SIGNER", "")
          runtime_dir = os.environ.get("XDG_RUNTIME_DIR", "")
          if not (os.path.isabs(signer) and os.path.isabs(runtime_dir) and os.environ.get("CERTUM_EMAIL") and os.environ.get("CERTUM_OTP")):
              sys.exit("Windows signing configuration is incomplete")
          if os.path.islink(signer) or not stat.S_ISREG(os.stat(signer).st_mode):
              sys.exit("Windows signer executable is unavailable")
          os.chmod(signer, 0o700)
          os.makedirs(runtime_dir, mode=0o700, exist_ok=True)
          os.chmod(runtime_dir, 0o700)
          cache_dir = os.path.join(runtime_dir, "ssign")
          os.makedirs(cache_dir, mode=0o700, exist_ok=True)
          os.chmod(cache_dir, 0o700)
          env = {k: os.environ.get(k, "") for k in ("CERTUM_EMAIL", "CERTUM_OTP", "XDG_RUNTIME_DIR", "HOME", "PATH")}

          for target in ("proxenos_x86_64-pc-windows-gnu", "proxenos_aarch64-pc-windows-gnullvm"):
              path = os.path.join(os.environ["RUNNER_TEMP"], "windows-unsigned", target, "proxenos.exe")
              if os.path.islink(path) or not stat.S_ISREG(os.stat(path).st_mode):
                  sys.exit(f"Windows binary missing for {target}")
              try:
                  res = subprocess.run([signer, path], env=env, stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=300)
              except subprocess.TimeoutExpired:
                  sys.exit(f"Windows signing deadline exceeded for {target}")
              if res.returncode != 0:
                  sys.exit(f"Windows signing failed for {target}")
          PY
          echo "amd64-sha256=$(sha256sum "$RUNNER_TEMP/windows-unsigned/proxenos_x86_64-pc-windows-gnu/proxenos.exe" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "arm64-sha256=$(sha256sum "$RUNNER_TEMP/windows-unsigned/proxenos_aarch64-pc-windows-gnullvm/proxenos.exe" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: signed-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-unsigned/proxenos_x86_64-pc-windows-gnu/proxenos.exe
            ${{ runner.temp }}/windows-unsigned/proxenos_aarch64-pc-windows-gnullvm/proxenos.exe
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package six archives, SBOMs and checksums
    needs: [check-release, build-linux-windows, sign-macos, verify-macos, sign-windows]
    if: github.repository == 'mateusz-klatt/proxenos' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      bundle-artifact-id: ${{ steps.upload-bundle.outputs.artifact-id }}
      checksums-sha256: ${{ steps.pack.outputs.checksums-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-linux-windows.outputs.linux-artifact-id }}
          path: ${{ runner.temp }}/in-linux

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign-macos.outputs.artifact-id }}
          path: ${{ runner.temp }}/in-macos

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign-windows.outputs.artifact-id }}
          path: ${{ runner.temp }}/in-windows

      - name: Install verified syft binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          syft_ver="${SYFT_VERSION#v}"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/anchore/syft/releases/download/${SYFT_VERSION}/syft_${syft_ver}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/syft_linux_amd64.tar.gz"
          printf '%s  %s\n' "$SYFT_TARBALL_SHA256_LINUX_AMD64" "$RUNNER_TEMP/syft_linux_amd64.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/syft_linux_amd64.tar.gz" -C "$RUNNER_TEMP/tools" syft
          printf '%s  %s\n' "$SYFT_SHA256_LINUX_AMD64" "$RUNNER_TEMP/tools/syft" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/tools/syft"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tools/syft" version

      - name: Verify all six binary digests, package archives, generate SBOMs and checksums
        id: pack
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
          EXPECTED_LINUX_AMD64_SHA256: ${{ needs.build-linux-windows.outputs.linux-amd64-sha256 }}
          EXPECTED_LINUX_ARM64_SHA256: ${{ needs.build-linux-windows.outputs.linux-arm64-sha256 }}
          EXPECTED_MACOS_AMD64_SHA256: ${{ needs.sign-macos.outputs.amd64-sha256 }}
          EXPECTED_MACOS_ARM64_SHA256: ${{ needs.sign-macos.outputs.arm64-sha256 }}
          EXPECTED_WINDOWS_AMD64_SHA256: ${{ needs.sign-windows.outputs.amd64-sha256 }}
          EXPECTED_WINDOWS_ARM64_SHA256: ${{ needs.sign-windows.outputs.arm64-sha256 }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$EXPECTED_LINUX_AMD64_SHA256" "$RUNNER_TEMP/in-linux/proxenos_x86_64-unknown-linux-musl/proxenos" | sha256sum --check --strict
          printf '%s  %s\n' "$EXPECTED_LINUX_ARM64_SHA256" "$RUNNER_TEMP/in-linux/proxenos_aarch64-unknown-linux-musl/proxenos" | sha256sum --check --strict
          printf '%s  %s\n' "$EXPECTED_MACOS_AMD64_SHA256" "$RUNNER_TEMP/in-macos/proxenos-darwin_x86_64-apple-darwin/proxenos" | sha256sum --check --strict
          printf '%s  %s\n' "$EXPECTED_MACOS_ARM64_SHA256" "$RUNNER_TEMP/in-macos/proxenos-darwin_aarch64-apple-darwin/proxenos" | sha256sum --check --strict
          printf '%s  %s\n' "$EXPECTED_WINDOWS_AMD64_SHA256" "$RUNNER_TEMP/in-windows/proxenos_x86_64-pc-windows-gnu/proxenos.exe" | sha256sum --check --strict
          printf '%s  %s\n' "$EXPECTED_WINDOWS_ARM64_SHA256" "$RUNNER_TEMP/in-windows/proxenos_aarch64-pc-windows-gnullvm/proxenos.exe" | sha256sum --check --strict

          COMMIT_TS="$(git show -s --format=%ct HEAD)"
          export COMMIT_TS

          python3 -I - <<'PY'
          import datetime
          import gzip
          import hashlib
          import io
          import json
          import os
          from pathlib import Path
          import subprocess
          import tarfile
          import zipfile

          version = os.environ["RELEASE_VERSION"]
          commit_ts = int(os.environ["COMMIT_TS"])
          zip_dt = datetime.datetime.fromtimestamp(commit_ts, tz=datetime.timezone.utc).timetuple()[:6]
          temp = Path(os.environ["RUNNER_TEMP"])
          out = temp / "release-bundle"
          out.mkdir(parents=True, exist_ok=True)

          license_bytes = Path("LICENSE").read_bytes()
          notice_bytes = Path("NOTICE").read_bytes()

          tar_targets = [
              (f"proxenos_{version}_linux_amd64.tar.gz", temp / "in-linux/proxenos_x86_64-unknown-linux-musl/proxenos"),
              (f"proxenos_{version}_linux_arm64.tar.gz", temp / "in-linux/proxenos_aarch64-unknown-linux-musl/proxenos"),
              (f"proxenos_{version}_darwin_amd64.tar.gz", temp / "in-macos/proxenos-darwin_x86_64-apple-darwin/proxenos"),
              (f"proxenos_{version}_darwin_arm64.tar.gz", temp / "in-macos/proxenos-darwin_aarch64-apple-darwin/proxenos"),
          ]

          zip_targets = [
              (f"proxenos_{version}_windows_amd64.zip", temp / "in-windows/proxenos_x86_64-pc-windows-gnu/proxenos.exe"),
              (f"proxenos_{version}_windows_arm64.zip", temp / "in-windows/proxenos_aarch64-pc-windows-gnullvm/proxenos.exe"),
          ]

          archives = []

          for archive_name, bin_path in tar_targets:
              archive_path = out / archive_name
              bin_bytes = bin_path.read_bytes()
              with archive_path.open("wb") as raw:
                  with gzip.GzipFile(filename="", mode="wb", fileobj=raw, mtime=commit_ts) as gz:
                      with tarfile.open(fileobj=gz, mode="w", format=tarfile.USTAR_FORMAT) as tf:
                          for name, data, mode in (
                              ("LICENSE", license_bytes, 0o644),
                              ("NOTICE", notice_bytes, 0o644),
                              ("proxenos", bin_bytes, 0o755),
                          ):
                              info = tarfile.TarInfo(name=name)
                              info.size = len(data)
                              info.mode = mode
                              info.uid = 0
                              info.gid = 0
                              info.uname = "root"
                              info.gname = "root"
                              info.mtime = commit_ts
                              tf.addfile(info, io.BytesIO(data))
              archives.append(archive_path)

          for archive_name, bin_path in zip_targets:
              archive_path = out / archive_name
              bin_bytes = bin_path.read_bytes()
              with zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_DEFLATED) as zf:
                  for name, data, mode in (
                      ("LICENSE", license_bytes, 0o644),
                      ("NOTICE", notice_bytes, 0o644),
                      ("proxenos.exe", bin_bytes, 0o755),
                  ):
                      zi = zipfile.ZipInfo(filename=name, date_time=zip_dt)
                      zi.compress_type = zipfile.ZIP_DEFLATED
                      zi.external_attr = (mode & 0xFFFF) << 16
                      zf.writestr(zi, data)
              archives.append(archive_path)

          syft_env = os.environ.copy()
          syft_env["SYFT_FILE_METADATA_CATALOGER_ENABLED"] = "true"
          subjects = []
          for archive_path in archives:
              sbom_path = out / f"{archive_path.name}.sbom.json"
              subprocess.run(
                  ["syft", str(archive_path), "--output", f"spdx-json={sbom_path}"],
                  env=syft_env,
                  check=True,
              )
              doc = json.loads(sbom_path.read_text())
              pkgs = {(p.get("name"), p.get("versionInfo")) for p in doc.get("packages", [])}
              pkg_names = {p[0] for p in pkgs}
              assert ("rmcp", "3.11.0") in pkgs, f"{sbom_path.name}: missing rmcp 3.11.0 in SPDX packages"
              assert len(pkgs) >= 10, f"{sbom_path.name}: unexpectedly few SPDX packages ({len(pkgs)})"
              if "_windows_" in sbom_path.name:
                  assert "windows-sys" in pkg_names, f"{sbom_path.name}: missing target-specific windows-sys crate"
              elif "_linux_" in sbom_path.name:
                  assert "windows-sys" not in pkg_names, f"{sbom_path.name}: unexpected windows-sys crate in Linux SBOM"
              subjects.extend([archive_path, sbom_path])

          subjects.sort(key=lambda p: p.name)
          assert len(subjects) == 12
          lines = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}" for p in subjects]
          manifest_bytes = ("\n".join(lines) + "\n").encode("utf-8")
          (out / "checksums.txt").write_bytes(manifest_bytes)
          manifest_sha = hashlib.sha256(manifest_bytes).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a") as out_f:
              out_f.write(f"checksums-sha256={manifest_sha}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### Packaged release checksums (12 subjects; `checksums.txt` SHA-256 `{manifest_sha}`)\n\n```text\n" + "\n".join(lines) + "\n```\n")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload-bundle
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle
          if-no-files-found: error
          retention-days: 1

  verify-macos-archives:
    name: Verify final macOS tarballs before publish
    needs: [check-release, sign-macos, package]
    if: github.repository == 'mateusz-klatt/proxenos' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: macos-latest
    timeout-minutes: 15
    permissions: {}
    outputs:
      checksums-sha256: ${{ steps.extract.outputs.checksums-sha256 }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.bundle-artifact-id }}
          path: ${{ runner.temp }}/release-bundle

      - name: Verify bundle inventory, archive checksums, embedded binary digests and extract macOS binaries
        id: extract
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.package.outputs.checksums-sha256 }}
          EXPECTED_MACOS_AMD64_SHA256: ${{ needs.sign-macos.outputs.amd64-sha256 }}
          EXPECTED_MACOS_ARM64_SHA256: ${{ needs.sign-macos.outputs.arm64-sha256 }}
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/release-bundle" "$RUNNER_TEMP/macos-verified" <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys
          import tarfile

          version = os.environ["RELEASE_VERSION"]
          expected_manifest_sha = os.environ["EXPECTED_CHECKSUMS_SHA256"]
          expected_bin_hashes = {
              "amd64": os.environ["EXPECTED_MACOS_AMD64_SHA256"],
              "arm64": os.environ["EXPECTED_MACOS_ARM64_SHA256"],
          }
          bundle = Path(sys.argv[1])
          out_root = Path(sys.argv[2])

          expected_archives = [
              f"proxenos_{version}_darwin_amd64.tar.gz",
              f"proxenos_{version}_darwin_arm64.tar.gz",
              f"proxenos_{version}_linux_amd64.tar.gz",
              f"proxenos_{version}_linux_arm64.tar.gz",
              f"proxenos_{version}_windows_amd64.zip",
              f"proxenos_{version}_windows_arm64.zip",
          ]
          expected_files = {"checksums.txt"} | set(expected_archives) | {f"{a}.sbom.json" for a in expected_archives}
          entries = list(bundle.iterdir())
          if len(entries) != 13 or any(p.is_symlink() or not p.is_file() for p in entries) or {p.name for p in entries} != expected_files:
              raise SystemExit(f"Invalid release bundle entries: {[p.name for p in entries]}")

          manifest_bytes = (bundle / "checksums.txt").read_bytes()
          manifest_sha = hashlib.sha256(manifest_bytes).hexdigest()
          if manifest_sha != expected_manifest_sha:
              raise SystemExit(f"checksums.txt digest mismatch: {manifest_sha} != {expected_manifest_sha}")

          hashes = {}
          for line in manifest_bytes.decode("utf-8").strip().splitlines():
              digest, name = line.split()
              hashes[name] = digest.lower()

          max_member_bytes = 128 * 1024 * 1024
          expected_tar_modes = {"LICENSE": 0o644, "NOTICE": 0o644, "proxenos": 0o755}
          for arch in ("amd64", "arm64"):
              name = f"proxenos_{version}_darwin_{arch}.tar.gz"
              archive_path = bundle / name
              archive_sha = hashlib.sha256(archive_path.read_bytes()).hexdigest()
              if hashes.get(name) != archive_sha:
                  raise SystemExit(f"{name}: checksum mismatch against checksums.txt")
              with tarfile.open(archive_path, "r:gz") as tf:
                  if tf.pax_headers:
                      raise SystemExit(f"{name}: unexpected archive PAX headers {tf.pax_headers!r}")
                  members = tf.getmembers()
                  names = [m.name for m in members]
                  if sorted(names) != ["LICENSE", "NOTICE", "proxenos"] or len(names) != 3:
                      raise SystemExit(f"{name}: unexpected tar members {names}")
                  for m in members:
                      if (
                          not m.isfile()
                          or m.pax_headers
                          or m.size > max_member_bytes
                          or (m.mode & 0o7000) != 0
                          or m.mode != expected_tar_modes[m.name]
                          or m.uid != 0
                          or m.gid != 0
                          or m.uname != "root"
                          or m.gname != "root"
                      ):
                          raise SystemExit(
                              f"{name}: invalid member metadata or size for {m.name} "
                              f"(mode={oct(m.mode)}, uid={m.uid}, gid={m.gid}, uname={m.uname!r}, gname={m.gname!r}, pax={m.pax_headers!r})"
                          )
                  f = tf.extractfile(tf.getmember("proxenos"))
                  assert f is not None
                  data = f.read(max_member_bytes + 1)
                  if len(data) > max_member_bytes:
                      raise SystemExit(f"{name}: binary exceeded bound")
              bin_sha = hashlib.sha256(data).hexdigest()
              if bin_sha != expected_bin_hashes[arch]:
                  raise SystemExit(f"{name}: embedded proxenos SHA-256 mismatch ({bin_sha} != {expected_bin_hashes[arch]})")
              dest = out_root / arch
              dest.mkdir(parents=True, mode=0o700, exist_ok=True)
              bin_path = dest / "proxenos"
              bin_path.write_bytes(data)
              os.chmod(bin_path, 0o755)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out_f:
              out_f.write(f"checksums-sha256={manifest_sha}\n")
          PY

      - name: Verify final macOS tarball architectures, signatures, notarization and arm64 execution
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cd "$RUNNER_TEMP/macos-verified"
          lipo -archs ./amd64/proxenos | grep -Fx 'x86_64'
          lipo -archs ./arm64/proxenos | grep -Fx 'arm64'
          for arch in amd64 arm64; do
            binary="./$arch/proxenos"
            printf '\n### Final macOS tarball (%s)\n\n```text\n' "$arch" >> "$GITHUB_STEP_SUMMARY"
            codesign --verify --strict --verbose=2 "$binary" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            codesign -dv --verbose=4 "$binary" 2>&1 | tee "$RUNNER_TEMP/macos-signature.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -Fx 'Authority=Developer ID Application: Mateusz Klatt (26MP7QQP95)' "$RUNNER_TEMP/macos-signature.txt"
            grep -Fx 'TeamIdentifier=26MP7QQP95' "$RUNNER_TEMP/macos-signature.txt"
            grep -E '^CodeDirectory .*flags=.*\(.*runtime.*\)' "$RUNNER_TEMP/macos-signature.txt"
            grep -E '^Timestamp=.+$' "$RUNNER_TEMP/macos-signature.txt"
            spctl -a -vvv -t install "$binary" 2>&1 | tee "$RUNNER_TEMP/macos-assessment.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            grep -Fx "$binary: accepted" "$RUNNER_TEMP/macos-assessment.txt"
            grep -Fx 'source=Notarized Developer ID' "$RUNNER_TEMP/macos-assessment.txt"
            printf '```\n' >> "$GITHUB_STEP_SUMMARY"
          done
          actual="$(./arm64/proxenos --version)"
          test "$actual" = "proxenos $RELEASE_VERSION"
          printf '\n### Final macOS arm64 tarball execution\n\n```text\n%s\n```\n' "$actual" >> "$GITHUB_STEP_SUMMARY"

  verify-windows:
    name: Verify final Windows archives before publish
    needs: [check-release, sign-windows, package]
    if: github.repository == 'mateusz-klatt/proxenos' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: windows-latest
    timeout-minutes: 15
    permissions: {}
    outputs:
      checksums-sha256: ${{ steps.extract.outputs.checksums-sha256 }}
    env:
      # Owner's Certum open-source code-signing certificate (valid until 2027-11-10).
      # Update this pin in both release.yml and signing-proof.yml when renewed.
      EXPECTED_SIGNER_THUMBPRINT: '9C837C68415187A72D88612BDF14FCB0D6623D67'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.bundle-artifact-id }}
          path: ${{ runner.temp }}/release-bundle

      - name: Verify bundle inventory, Windows archive checksums, embedded binary digests, contents and PE architectures
        id: extract
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
          EXPECTED_CHECKSUMS_SHA256: ${{ needs.package.outputs.checksums-sha256 }}
          EXPECTED_WINDOWS_AMD64_SHA256: ${{ needs.sign-windows.outputs.amd64-sha256 }}
          EXPECTED_WINDOWS_ARM64_SHA256: ${{ needs.sign-windows.outputs.arm64-sha256 }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $version = $env:RELEASE_VERSION
          $bundle = Join-Path $env:RUNNER_TEMP 'release-bundle'
          $outRoot = Join-Path $env:RUNNER_TEMP 'windows-verified'
          $expectedZips = [ordered]@{
            amd64 = @{ Name = "proxenos_${version}_windows_amd64.zip"; Machine = [uint16]0x8664; BinarySha256 = $env:EXPECTED_WINDOWS_AMD64_SHA256 }
            arm64 = @{ Name = "proxenos_${version}_windows_arm64.zip"; Machine = [uint16]0xAA64; BinarySha256 = $env:EXPECTED_WINDOWS_ARM64_SHA256 }
          }
          $expectedArchives = @(
            "proxenos_${version}_darwin_amd64.tar.gz",
            "proxenos_${version}_darwin_arm64.tar.gz",
            "proxenos_${version}_linux_amd64.tar.gz",
            "proxenos_${version}_linux_arm64.tar.gz",
            "proxenos_${version}_windows_amd64.zip",
            "proxenos_${version}_windows_arm64.zip"
          )
          $expectedFiles = @('checksums.txt') + $expectedArchives + ($expectedArchives | ForEach-Object { "${_}.sbom.json" })

          $items = @(Get-ChildItem -LiteralPath $bundle -Force)
          if ($items.Count -ne 13) {
            throw "Invalid release bundle file count: $($items.Count)"
          }
          foreach ($item in $items) {
            if ($item.PSIsContainer -or $item.LinkType -or ($item.Name -cnotin $expectedFiles)) {
              throw "Invalid release bundle entry: $($item.Name)"
            }
          }

          function Get-Sha256Hex([byte[]]$Data) {
            $sha = [Security.Cryptography.SHA256]::Create()
            try {
              return ([BitConverter]::ToString($sha.ComputeHash($Data)) -replace '-', '').ToLowerInvariant()
            } finally {
              $sha.Dispose()
            }
          }

          $manifestPath = Join-Path $bundle 'checksums.txt'
          $manifestBytes = [IO.File]::ReadAllBytes($manifestPath)
          if ($manifestBytes.Length -gt 1048576) {
            throw "checksums.txt exceeds size limit."
          }
          $manifestSha = Get-Sha256Hex $manifestBytes
          if ($manifestSha -cne $env:EXPECTED_CHECKSUMS_SHA256) {
            throw "checksums.txt digest mismatch: $manifestSha != $($env:EXPECTED_CHECKSUMS_SHA256)"
          }

          $hashes = @{}
          foreach ($rawLine in ([Text.Encoding]::UTF8.GetString($manifestBytes).Trim() -split "`r?`n")) {
            $fields = $rawLine.Trim() -split '\s+'
            if ($fields.Count -ne 2 -or $fields[0] -notmatch '^[0-9a-fA-F]{64}$') {
              throw "Malformed checksum manifest line."
            }
            if ($hashes.ContainsKey($fields[1])) {
              throw "Duplicate checksum entry: $($fields[1])"
            }
            $hashes[$fields[1]] = $fields[0].ToLowerInvariant()
          }

          $maxZipBytes = 128L * 1024L * 1024L
          $maxMemberBytes = 128L * 1024L * 1024L
          [long]$remaining = 256L * 1024L * 1024L

          $summary = [Collections.Generic.List[string]]::new()
          $summary.Add("### Windows verification SHA-256 evidence`n")
          $summary.Add("- ``checksums.txt``: ``$manifestSha``")

          foreach ($arch in 'amd64', 'arm64') {
            $zipName = $expectedZips[$arch].Name
            $expectedMachine = $expectedZips[$arch].Machine
            $zipPath = Join-Path $bundle $zipName
            $zipInfo = Get-Item -LiteralPath $zipPath
            if ($zipInfo.Length -gt $maxZipBytes) {
              throw "${zipName}: exceeds size limit."
            }
            $zipBytes = [IO.File]::ReadAllBytes($zipPath)
            $zipHash = Get-Sha256Hex $zipBytes
            if (-not $hashes.ContainsKey($zipName) -or $hashes[$zipName] -ne $zipHash) {
              throw "${zipName}: checksum mismatch against checksums.txt."
            }
            $summary.Add("- ``${zipName}``: ``${zipHash}``")

            $exeBytes = $null
            $zip = [IO.Compression.ZipFile]::OpenRead($zipPath)
            try {
              $entries = @($zip.Entries)
              $names = @($entries | ForEach-Object { $_.FullName } | Sort-Object)
              if ($entries.Count -ne 3 -or ($names -join ',') -cne 'LICENSE,NOTICE,proxenos.exe') {
                throw "${zipName}: unexpected ZIP members ($($names -join ', '))."
              }
              foreach ($entry in $entries) {
                if ($entry.FullName.EndsWith('/') -or $entry.Length -gt $maxMemberBytes -or $entry.Length -gt $remaining) {
                  throw "${zipName}: invalid or oversized member $($entry.FullName)."
                }
                $limit = [Math]::Min($maxMemberBytes, $remaining)
                $stream = $entry.Open()
                $ms = [IO.MemoryStream]::new()
                try {
                  $buf = New-Object byte[] 65536
                  [long]$total = 0
                  while (($read = $stream.Read($buf, 0, $buf.Length)) -gt 0) {
                    $total += $read
                    if ($total -gt $limit) {
                      throw "${zipName}: member $($entry.FullName) exceeded decompression bound."
                    }
                    $ms.Write($buf, 0, $read)
                  }
                  $data = $ms.ToArray()
                } finally {
                  $ms.Dispose()
                  $stream.Dispose()
                }
                $remaining -= $data.LongLength
                if ($entry.FullName -ceq 'proxenos.exe') {
                  $exeBytes = $data
                }
              }
            } finally {
              $zip.Dispose()
            }

            if ($null -eq $exeBytes -or $exeBytes.Length -lt 0x40 -or $exeBytes[0] -ne 0x4D -or $exeBytes[1] -ne 0x5A) {
              throw "${zipName}: invalid PE header."
            }
            $peOffset = [BitConverter]::ToUInt32($exeBytes, 0x3C)
            if (($peOffset + 6) -gt $exeBytes.Length -or
                $exeBytes[$peOffset] -ne 0x50 -or $exeBytes[$peOffset + 1] -ne 0x45 -or
                $exeBytes[$peOffset + 2] -ne 0 -or $exeBytes[$peOffset + 3] -ne 0) {
              throw "${zipName}: missing PE signature."
            }
            $machine = [BitConverter]::ToUInt16($exeBytes, [int]($peOffset + 4))
            if ($machine -ne $expectedMachine) {
              throw ("${zipName}: wrong PE machine 0x{0:x4}, expected 0x{1:x4}." -f $machine, $expectedMachine)
            }

            $exeHash = Get-Sha256Hex $exeBytes
            if ($exeHash -cne $expectedZips[$arch].BinarySha256) {
              throw "${zipName}: embedded proxenos.exe SHA-256 mismatch ($exeHash != $($expectedZips[$arch].BinarySha256))."
            }

            $destDir = Join-Path $outRoot $arch
            New-Item -ItemType Directory -Path $destDir -Force | Out-Null
            [IO.File]::WriteAllBytes((Join-Path $destDir 'proxenos.exe'), $exeBytes)
            $summary.Add("- ``${arch}/proxenos.exe``: ``$exeHash``")
          }

          "checksums-sha256=$manifestSha" >> $env:GITHUB_OUTPUT
          ($summary -join "`n") + "`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Verify both Authenticode signatures and amd64 execution
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }
          foreach ($arch in 'amd64', 'arm64') {
            $file = Join-Path $env:RUNNER_TEMP "windows-verified/$arch/proxenos.exe"
            & $signtool verify /pa /all /v /tw $file
            if ($LASTEXITCODE -ne 0) { throw "signtool verification failed for $arch (exit $LASTEXITCODE)." }
            $signature = Get-AuthenticodeSignature -FilePath $file
            if ($signature.Status -ne 'Valid' -or
                $null -eq $signature.TimeStamperCertificate -or
                $signature.SignerCertificate.Thumbprint -ne $env:EXPECTED_SIGNER_THUMBPRINT) {
              throw "Authenticode verification failed for ${arch}: expected a valid, timestamped signature from the pinned certificate."
            }
            "${arch}: valid timestamped signature; signer $($signature.SignerCertificate.Thumbprint); timestamp signer $($signature.TimeStamperCertificate.Subject)" >> $env:GITHUB_STEP_SUMMARY
          }
          $actual = (& (Join-Path $env:RUNNER_TEMP "windows-verified/amd64/proxenos.exe") --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne "proxenos $env:RELEASE_VERSION") {
            throw "Unexpected Windows amd64 version output: $actual"
          }
          "amd64 execution: ``$actual``" >> $env:GITHUB_STEP_SUMMARY

  publish:
    name: Sign checksums, attest provenance and create draft release
    needs: [check-release, build-linux-windows, sign-macos, verify-macos, sign-windows, package, verify-macos-archives, verify-windows]
    if: github.repository == 'mateusz-klatt/proxenos' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # check drafts, create the draft GitHub release and upload verified assets
      id-token: write # keyless cosign signing and build provenance attestation
      attestations: write
    steps:
      - name: Verify exact repository and main ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mateusz-klatt/proxenos"
          test "$GITHUB_REF" = "refs/heads/main"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.bundle-artifact-id }}
          path: ${{ runner.temp }}/release-bundle

      - name: Verify bundle inventory, per-target executable digests and bind to verified checksums.txt digest
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
          MACOS_VERIFIED_CHECKSUMS_SHA256: ${{ needs.verify-macos-archives.outputs.checksums-sha256 }}
          WINDOWS_VERIFIED_CHECKSUMS_SHA256: ${{ needs.verify-windows.outputs.checksums-sha256 }}
          EXPECTED_LINUX_AMD64_SHA256: ${{ needs.build-linux-windows.outputs.linux-amd64-sha256 }}
          EXPECTED_LINUX_ARM64_SHA256: ${{ needs.build-linux-windows.outputs.linux-arm64-sha256 }}
          EXPECTED_MACOS_AMD64_SHA256: ${{ needs.sign-macos.outputs.amd64-sha256 }}
          EXPECTED_MACOS_ARM64_SHA256: ${{ needs.sign-macos.outputs.arm64-sha256 }}
          EXPECTED_WINDOWS_AMD64_SHA256: ${{ needs.sign-windows.outputs.amd64-sha256 }}
          EXPECTED_WINDOWS_ARM64_SHA256: ${{ needs.sign-windows.outputs.arm64-sha256 }}
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/release-bundle" <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys
          import tarfile
          import zipfile

          version = os.environ["RELEASE_VERSION"]
          macos_sha = os.environ["MACOS_VERIFIED_CHECKSUMS_SHA256"]
          windows_sha = os.environ["WINDOWS_VERIFIED_CHECKSUMS_SHA256"]
          bundle = Path(sys.argv[1])

          expected_archives = [
              f"proxenos_{version}_darwin_amd64.tar.gz",
              f"proxenos_{version}_darwin_arm64.tar.gz",
              f"proxenos_{version}_linux_amd64.tar.gz",
              f"proxenos_{version}_linux_arm64.tar.gz",
              f"proxenos_{version}_windows_amd64.zip",
              f"proxenos_{version}_windows_arm64.zip",
          ]
          expected_subjects = sorted(expected_archives + [f"{a}.sbom.json" for a in expected_archives])
          expected_files = {"checksums.txt"} | set(expected_subjects)

          entries = list(bundle.iterdir())
          if len(entries) != 13 or any(p.is_symlink() or not p.is_file() for p in entries) or {p.name for p in entries} != expected_files:
              raise SystemExit(f"Unexpected bundle entries (files, symlinks or directories): {[p.name for p in entries]}")

          manifest_bytes = (bundle / "checksums.txt").read_bytes()
          manifest_sha = hashlib.sha256(manifest_bytes).hexdigest()
          if manifest_sha != macos_sha or manifest_sha != windows_sha:
              raise SystemExit(
                  f"checksums.txt digest mismatch: bundle={manifest_sha}, macos={macos_sha}, windows={windows_sha}"
              )

          lines = [line.strip() for line in manifest_bytes.decode("utf-8").splitlines() if line.strip()]
          if len(lines) != 12:
              raise SystemExit(f"Expected 12 lines in checksums.txt, got {len(lines)}")
          seen = []
          for line in lines:
              digest, name = line.split()
              actual = hashlib.sha256((bundle / name).read_bytes()).hexdigest()
              if actual != digest.lower():
                  raise SystemExit(f"Checksum mismatch for {name}")
              seen.append(name)
          if sorted(seen) != expected_subjects:
              raise SystemExit(f"checksums.txt subjects do not match expected inventory: {seen}")

          max_member_bytes = 128 * 1024 * 1024
          expected_tar_modes = {"LICENSE": 0o644, "NOTICE": 0o644, "proxenos": 0o755}
          tar_expectations = {
              f"proxenos_{version}_linux_amd64.tar.gz": os.environ["EXPECTED_LINUX_AMD64_SHA256"],
              f"proxenos_{version}_linux_arm64.tar.gz": os.environ["EXPECTED_LINUX_ARM64_SHA256"],
              f"proxenos_{version}_darwin_amd64.tar.gz": os.environ["EXPECTED_MACOS_AMD64_SHA256"],
              f"proxenos_{version}_darwin_arm64.tar.gz": os.environ["EXPECTED_MACOS_ARM64_SHA256"],
          }
          for archive_name, expected_bin_sha in tar_expectations.items():
              with tarfile.open(bundle / archive_name, "r:gz") as tf:
                  if tf.pax_headers:
                      raise SystemExit(f"{archive_name}: unexpected archive PAX headers {tf.pax_headers!r}")
                  members = tf.getmembers()
                  names = [m.name for m in members]
                  if len(names) != 3 or sorted(names) != ["LICENSE", "NOTICE", "proxenos"]:
                      raise SystemExit(f"{archive_name}: unexpected tar members {names}")
                  for m in members:
                      if (
                          not m.isfile()
                          or m.pax_headers
                          or m.size > max_member_bytes
                          or (m.mode & 0o7000) != 0
                          or m.mode != expected_tar_modes[m.name]
                          or m.uid != 0
                          or m.gid != 0
                          or m.uname != "root"
                          or m.gname != "root"
                      ):
                          raise SystemExit(
                              f"{archive_name}: invalid member metadata or size for {m.name} "
                              f"(mode={oct(m.mode)}, uid={m.uid}, gid={m.gid}, uname={m.uname!r}, gname={m.gname!r}, pax={m.pax_headers!r})"
                          )
                  f = tf.extractfile(tf.getmember("proxenos"))
                  if f is None:
                      raise SystemExit(f"{archive_name}: missing proxenos member")
                  data = f.read(max_member_bytes + 1)
                  if len(data) > max_member_bytes:
                      raise SystemExit(f"{archive_name}: binary exceeded bound")
              actual_bin_sha = hashlib.sha256(data).hexdigest()
              if actual_bin_sha != expected_bin_sha:
                  raise SystemExit(
                      f"{archive_name}: embedded proxenos SHA-256 mismatch ({actual_bin_sha} != {expected_bin_sha})"
                  )

          expected_zip_modes = {"LICENSE": 0o644, "NOTICE": 0o644, "proxenos.exe": 0o755}
          zip_expectations = {
              f"proxenos_{version}_windows_amd64.zip": os.environ["EXPECTED_WINDOWS_AMD64_SHA256"],
              f"proxenos_{version}_windows_arm64.zip": os.environ["EXPECTED_WINDOWS_ARM64_SHA256"],
          }
          for archive_name, expected_bin_sha in zip_expectations.items():
              with zipfile.ZipFile(bundle / archive_name, "r") as zf:
                  infos = zf.infolist()
                  names = [info.filename for info in infos]
                  if len(names) != 3 or sorted(names) != ["LICENSE", "NOTICE", "proxenos.exe"]:
                      raise SystemExit(f"{archive_name}: unexpected zip members {names}")
                  for info in infos:
                      unix_mode = info.external_attr >> 16
                      if (
                          info.is_dir()
                          or info.file_size > max_member_bytes
                          or (unix_mode & 0o170000) == 0o120000
                          or (unix_mode & 0o7000) != 0
                          or info.external_attr != (expected_zip_modes[info.filename] << 16)
                      ):
                          raise SystemExit(
                              f"{archive_name}: invalid member metadata or size for {info.filename} "
                              f"(external_attr=0x{info.external_attr:08x})"
                          )
                  with zf.open("proxenos.exe", "r") as f:
                      data = f.read(max_member_bytes + 1)
                  if len(data) > max_member_bytes:
                      raise SystemExit(f"{archive_name}: binary exceeded bound")
              actual_bin_sha = hashlib.sha256(data).hexdigest()
              if actual_bin_sha != expected_bin_sha:
                  raise SystemExit(
                      f"{archive_name}: embedded proxenos.exe SHA-256 mismatch ({actual_bin_sha} != {expected_bin_sha})"
                  )
          PY

      - name: Verify no tag or release (draft or published) exists before permanent signing
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.check-release.outputs.tag }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = "mateusz-klatt/proxenos"
          tag = os.environ["RELEASE_TAG"]
          token = os.environ["GITHUB_TOKEN"]
          api_base = "https://api.github.com"

          def api_get(url: str) -> tuple[int, dict | list | None]:
              req = urllib.request.Request(url, method="GET")
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status, json.loads(resp.read().decode("utf-8"))
              except urllib.error.HTTPError as err:
                  if err.code == 404:
                      return 404, None
                  raise

          status, _ = api_get(f"{api_base}/repos/{repo}/git/ref/tags/{urllib.parse.quote(tag, safe='')}")
          if status != 404:
              raise SystemExit(f"Refusing to sign or publish: tag {tag} already exists")

          page = 1
          existing = []
          while True:
              status, batch = api_get(f"{api_base}/repos/{repo}/releases?per_page=100&page={page}")
              assert status == 200 and isinstance(batch, list)
              if not batch:
                  break
              existing.extend(r for r in batch if r.get("tag_name") == tag)
              if len(batch) < 100:
                  break
              page += 1

          for rel in existing:
              if not rel.get("draft", False):
                  raise SystemExit(f"Refusing to sign or publish: published release id={rel.get('id')} already exists for {tag}")
          if existing:
              ids = [r.get("id") for r in existing]
              raise SystemExit(f"Refusing to sign or publish: draft release(s) {ids} already exist for {tag}")
          PY

      - name: Install verified cosign binary and sign checksums.txt keylessly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          curl --proto '=https' --tlsv1.2 -fsSL "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" \
            -o "$RUNNER_TEMP/tools/cosign"
          printf '%s  %s\n' "$COSIGN_SHA256_LINUX_AMD64" "$RUNNER_TEMP/tools/cosign" | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/tools/cosign"
          "$RUNNER_TEMP/tools/cosign" version
          "$RUNNER_TEMP/tools/cosign" sign-blob \
            --bundle="$RUNNER_TEMP/release-bundle/checksums.txt.sigstore.json" \
            "$RUNNER_TEMP/release-bundle/checksums.txt" \
            --yes

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release-bundle/checksums.txt

      - name: Create verified draft GitHub release and upload all 14 assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.check-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP/release-bundle" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = "mateusz-klatt/proxenos"
          tag = os.environ["RELEASE_TAG"]
          version = os.environ["RELEASE_VERSION"]
          commit = os.environ["RELEASE_COMMIT"]
          token = os.environ["GITHUB_TOKEN"]
          bundle = Path(sys.argv[1])
          api_base = "https://api.github.com"

          expected_archives = [
              f"proxenos_{version}_darwin_amd64.tar.gz",
              f"proxenos_{version}_darwin_arm64.tar.gz",
              f"proxenos_{version}_linux_amd64.tar.gz",
              f"proxenos_{version}_linux_arm64.tar.gz",
              f"proxenos_{version}_windows_amd64.zip",
              f"proxenos_{version}_windows_arm64.zip",
          ]
          expected_names = sorted(
              expected_archives
              + [f"{a}.sbom.json" for a in expected_archives]
              + ["checksums.txt", "checksums.txt.sigstore.json"]
          )
          entries = list(bundle.iterdir())
          if len(entries) != 14 or any(p.is_symlink() or not p.is_file() for p in entries) or sorted(p.name for p in entries) != expected_names:
              raise SystemExit(f"Unexpected release bundle contents before upload: {[p.name for p in entries]}")

          def api_request(method: str, url: str, data: bytes | None = None, content_type: str = "application/json") -> dict | list:
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              if data is not None:
                  req.add_header("Content-Type", content_type)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          # 1. Re-check immediately before creating the draft that no tag or release exists.
          try:
              api_request("GET", f"{api_base}/repos/{repo}/git/ref/tags/{urllib.parse.quote(tag, safe='')}")
              raise SystemExit(f"Refusing to upload: tag {tag} now exists")
          except urllib.error.HTTPError as err:
              if err.code != 404:
                  raise

          page = 1
          existing = []
          while True:
              batch = api_request("GET", f"{api_base}/repos/{repo}/releases?per_page=100&page={page}")
              if not batch:
                  break
              existing.extend(r for r in batch if r.get("tag_name") == tag)
              if len(batch) < 100:
                  break
              page += 1
          for rel in existing:
              if not rel.get("draft", False):
                  raise SystemExit(f"Refusing to upload: published release id={rel.get('id')} already exists for {tag}")
          if existing:
              ids = [r.get("id") for r in existing]
              raise SystemExit(f"Refusing to upload: draft release(s) {ids} already exist for {tag}")

          # 2. Create a draft release for tag_name v<version> targeting the dispatched commit.
          #    GitHub creates the tag only when the owner publishes this draft.
          is_prerelease = "-" in version
          payload = json.dumps({
              "tag_name": tag,
              "target_commitish": commit,
              "name": tag,
              "draft": True,
              "prerelease": is_prerelease,
              "generate_release_notes": True,
          }).encode("utf-8")
          created = api_request("POST", f"{api_base}/repos/{repo}/releases", data=payload)
          release_id = created["id"]
          print(f"Created draft release id={release_id} for {tag} targeting {commit}")
          if created.get("draft") is not True or created.get("tag_name") != tag:
              raise SystemExit(f"Created release {release_id} is not a draft for {tag}")

          # 3. Verify the draft by numeric ID before uploading any asset.
          checked = api_request("GET", f"{api_base}/repos/{repo}/releases/{release_id}")
          if checked.get("draft") is not True or checked.get("tag_name") != tag or len(checked.get("assets", [])) != 0:
              raise SystemExit(f"Release {release_id} failed pre-upload draft verification")

          # 4. Upload all 14 verified files directly to the numeric draft release ID.
          expected_digests = {}
          for name in expected_names:
              data = (bundle / name).read_bytes()
              expected_digests[name] = f"sha256:{hashlib.sha256(data).hexdigest()}"
              upload_url = f"https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name={urllib.parse.quote(name)}"
              api_request("POST", upload_url, data=data, content_type="application/octet-stream")

          # 5. Confirm the release is still a draft with all 14 expected assets and digests attached.
          final = api_request("GET", f"{api_base}/repos/{repo}/releases/{release_id}")
          final_assets = final.get("assets", [])
          actual_digests = {a.get("name"): a.get("digest") for a in final_assets}
          if (
              final.get("draft") is not True
              or final.get("prerelease") is not is_prerelease
              or len(final_assets) != 14
              or actual_digests != expected_digests
          ):
              raise SystemExit(f"Release {release_id} failed post-upload draft verification")

          prerelease_flag = "true" if is_prerelease else "false"
          expected_asset_lines = "\n".join(f"{name}  {expected_digests[name]}" for name in expected_names)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(
                  f"### Draft release `{tag}` ready for publication\n\n"
                  f"- Release ID: `{release_id}`\n"
                  f"- Tag: `{tag}`\n"
                  f"- Dispatched commit SHA: `{commit}`\n"
                  f"- Prerelease: `{prerelease_flag}`\n"
                  f"- Verified assets uploaded: `14`\n\n"
                  f"Expected remote assets (`name  sha256:<digest>`):\n\n"
                  f"```text\n{expected_asset_lines}\n```\n\n"
                  f"Do **not** click **Publish** in the GitHub UI. First verify that the tag does not exist, that the draft metadata matches, and that all 14 remote asset digests match:\n\n"
                  f"```sh\n"
                  f"# 1. Must return empty (do not compare SHAs; annotated tags return the tag object SHA):\n"
                  f"git ls-remote origin 'refs/tags/{tag}'\n\n"
                  f"# 2. Must show draft=true, prerelease={prerelease_flag}, tag_name={tag}, target_commitish={commit}, assets=14:\n"
                  f"gh api repos/{repo}/releases/{release_id} --jq '{{draft, prerelease, tag_name, target_commitish, assets: (.assets | length)}}'\n\n"
                  f"# 3. Must exit 0 with empty output (compares all 14 remote name + SHA-256 digests):\n"
                  f"diff -u - <(gh api --paginate repos/{repo}/releases/{release_id}/assets --jq '.[] | \"\\(.name)  \\(.digest)\"' | LC_ALL=C sort) <<'EOF'\n"
                  f"{expected_asset_lines}\n"
                  f"EOF\n"
                  f"```\n\n"
                  f"Then publish with one owner-authorised API request that sets every field explicitly:\n\n"
                  f"```sh\n"
                  f"gh api -X PATCH repos/{repo}/releases/{release_id} -F draft=false -F prerelease={prerelease_flag} -f tag_name={tag} -f target_commitish={commit}\n"
                  f"```\n"
              )
          PY
