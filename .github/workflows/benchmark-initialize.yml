name: Benchmark MCP servers

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/benchmark-initialize.yml'
      - 'src/compare_init.rs'
  workflow_dispatch:
    inputs:
      measurement:
        description: Measurement to run
        type: choice
        options: [initialize, provider-scenarios, tree-cancel, all]
        default: initialize

permissions:
  contents: read

jobs:
  initialize:
    if: ${{ github.event_name == 'pull_request' || inputs.measurement == 'initialize' || inputs.measurement == 'all' }}
    name: MCP initialize (${{ matrix.platform }}, 20 pairs)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            platform: linux
            exe_suffix: ''
          - runner: windows-latest
            platform: windows
            exe_suffix: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      BENCHMARK_OS: ${{ matrix.platform }}
      EXE_SUFFIX: ${{ matrix.exe_suffix }}
      PROXENOS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASELINE_SHA: cd4eb9ec6b08bc065884be893ae4bf55367ae9fe

    steps:
      - name: Check out the measured Proxenos commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ env.PROXENOS_SHA }}
          path: proxenos
          persist-credentials: false

      - name: Check out claude-delegator v3.5.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mateusz-klatt/claude-delegator
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          persist-credentials: false

      - name: Install the baseline runtime dependencies
        working-directory: baseline
        run: |
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 12)) throw Error("Node 22.12 or later required");'
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Build the release server and benchmark tools
        working-directory: proxenos
        run: |
          cargo build --locked --release --bin proxenos
          cargo build --locked --release --features test-tools --bin proxenos-stub --bin compare_init

      - name: Record the build and runner
        working-directory: proxenos
        run: |
          test "$(git rev-parse HEAD)" = "$PROXENOS_SHA"
          test "$(git -C ../baseline rev-parse HEAD)" = "$BASELINE_SHA"
          node_bin="$(node -e 'process.stdout.write(process.execPath)')"
          printf 'BENCHMARK_NODE=%s\n' "$node_bin" >> "$GITHUB_ENV"
          mkdir ../results
          {
            printf 'Run %s/%s/actions/runs/%s (attempt %s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Proxenos %s\nclaude-delegator %s\n' "$PROXENOS_SHA" "$BASELINE_SHA"
            printf 'Runner image %s %s\n' "$ImageOS" "$ImageVersion"
            node -e 'const os = require("node:os"); const cpus = os.cpus();
              console.log("OS", os.type(), os.release(), os.version(), os.arch());
              console.log("Logical CPUs", cpus.length, "Models", [...new Set(cpus.map(cpu => cpu.model))].join(", "));'
            if [[ "$RUNNER_OS" == Linux ]]; then
              cat /etc/os-release
              uname -srmo
              lscpu
            fi
            rustc -Vv
            cargo -Vv
            printf 'Node %s at %s\n' "$(node --version)" "$node_bin"
            printf 'npm %s\n' "$(npm --version)"
            sha256sum Cargo.lock ../baseline/package-lock.json "target/release/compare_init$EXE_SUFFIX"
          } > ../results/provenance.txt

      - name: Measure 20 balanced pairs
        id: measure
        working-directory: proxenos
        run: |
          "target/release/compare_init$EXE_SUFFIX" "target/release/proxenos$EXE_SUFFIX" "$BENCHMARK_NODE" \
            "../baseline" "target/release/proxenos-stub$EXE_SUFFIX" 20 > ../results/initialize.json

      - name: Diagnose a failed Windows baseline start
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.measure.outcome == 'failure' }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawn } from 'node:child_process';
          import readline from 'node:readline';
          const report = JSON.parse(fs.readFileSync('results/initialize.json', 'utf8'));
          if (!report.summary.claude_delegator.failed) process.exit(0);

          const { node, bridge, stub } = report.inputs;
          function plain(name) {
            const ordinary = name.replace(/^\\\\\?\\(?=[A-Za-z]:\\)/, '');
            if (ordinary === name || path.win32.toNamespacedPath(ordinary) !== name) {
              throw new Error('Expected a canonical Windows drive path for the diagnostic');
            }
            return ordinary;
          }
          const identity = name => name;
          const request = { jsonrpc: '2.0', id: 1, method: 'initialize',
            params: { protocolVersion: report.protocol_revision, capabilities: {},
              clientInfo: { name: 'proxenos-comparison', version: '1' } } };
          async function inspect(label, entry, paths) {
            const profile = fs.mkdtempSync(path.join(paths(path.dirname(stub.path)), 'proxenos-diagnostic-'));
            try {
              const bin = path.join(profile, 'bin');
              fs.mkdirSync(bin);
              fs.linkSync(stub.path, path.join(bin, 'codex.exe'));
              const env = { PATH: bin, SystemRoot: process.env.SystemRoot };
              for (const key of ['HOME', 'USERPROFILE', 'LOCALAPPDATA', 'APPDATA', 'TMPDIR', 'TEMP', 'TMP', 'PROXENOS_STUB_DIR']) env[key] = profile;
              const script = entry(bridge.path);
              const child = spawn(paths(node.path), [script], { cwd: profile, env, timeout: 10_000 });
              let stdoutBytes = 0, stderrBytes = 0, stderr = '', initialized = false, spawnError;
              const marker = 'codex cli not found';
              let stderrTail = '', codexCliNotFound = false;
              child.stdin.on('error', error => { spawnError ??= error.code; });
              child.on('error', error => { spawnError = error.code; });
              child.stderr.on('data', chunk => {
                stderrBytes += chunk.length;
                const text = chunk.toString();
                if (stderr.length < 4096) stderr += text.slice(0, 4096 - stderr.length);
                const window = stderrTail + text.toLowerCase();
                codexCliNotFound ||= window.includes(marker);
                stderrTail = window.slice(1 - marker.length);
              });
              child.stdout.on('data', chunk => { stdoutBytes += chunk.length; if (stdoutBytes >= 1024 * 1024) child.kill(); });
              readline.createInterface({ input: child.stdout }).on('line', line => {
                try {
                  const msg = JSON.parse(line);
                  if (msg.id !== 1 || msg.result?.serverInfo?.name !== 'claude-delegator-codex') return;
                } catch { return; }
                initialized = true;
                child.stdin.end(JSON.stringify({ jsonrpc: '2.0', method: 'notifications/initialized' }) + '\n');
              });
              child.stdin.write(JSON.stringify(request) + '\n');
              const [status, signal] = await new Promise(resolve => child.once('close', (...args) => resolve(args)));
              const log = path.join(profile, 'invocations');
              const codexVersionInvoked = fs.existsSync(log) && fs.readFileSync(log, 'utf8').split(/\r?\n/).some(line => {
                if (!line) return false;
                const { cli, args } = JSON.parse(line);
                return cli === 'codex' && args.includes('--version');
              });
              return { label, entryPathChanged: script !== bridge.path, initialized, status, signal, spawnError,
                stdoutBytes, stderrBytes, codexVersionInvoked, codexCliNotFound,
                errors: stderr.split(/\r?\n/).filter(s => /^(?:[\w.]*Error|\s*code: |Require stack:)/.test(s)).slice(0, 6).map(s => s.slice(0, 350)),
                frames: stderr.split(/\r?\n/).filter(s => /^\s+at /.test(s)).slice(0, 6).map(s => s.slice(0, 350)) };
            } finally { fs.rmSync(profile, { recursive: true, force: true }); }
          }
          const diagnostics = [
            await inspect('recorded-paths', identity, identity),
            await inspect('ordinary-entry', plain, identity),
            await inspect('ordinary-paths', plain, plain),
          ];
          fs.writeFileSync('results/windows-diagnostics.json', JSON.stringify(diagnostics, null, 2));
          JS

      - name: Summarize every measured target
        if: ${{ !cancelled() && steps.measure.outcome != 'skipped' }}
        run: |
          jq -e --arg os "$BENCHMARK_OS" '.os == $os and .d12_baseline_version_matches and .inputs.pairs == 20 and (.trials | length == 40)' results/initialize.json > /dev/null
          {
            echo '## MCP process startup to initialize response'
            echo
            printf '20 alternating pairs on one %s runner. Each median includes successful trials only.\n' "$RUNNER_OS"
            echo
            echo '| Target | Successful | Failed | Median (ms) |'
            echo '| --- | ---: | ---: | ---: |'
            jq -r '.summary | to_entries[] | "| \(.key) | \(.value.successful) | \(.value.failed) | \(.value.median_ms // "n/a") |"' results/initialize.json
            echo
            echo "The artifact contains all trials, file hashes and the runner and build details."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trials and provenance
        if: ${{ !cancelled() && steps.measure.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-initialize-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: error
          retention-days: 30

  provider-scenarios:
    name: Stubbed Codex and Antigravity scenarios
    if: ${{ github.event_name == 'pull_request' || inputs.measurement != 'initialize' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PROXENOS_SHA: 651991f217bb57463a6375bcea18bf12d184880e
      HARNESS_SHA: 7ea45c7230ca1d3fb27e5bac37492785c518f31d
      BASELINE_SHA: cd4eb9ec6b08bc065884be893ae4bf55367ae9fe

    steps:
      - name: Check out the measured server and stub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mateusz-klatt/proxenos
          ref: ${{ env.PROXENOS_SHA }}
          path: proxenos
          persist-credentials: false

      - name: Check out the published comparison harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mateusz-klatt/proxenos
          ref: ${{ env.HARNESS_SHA }}
          path: harness
          persist-credentials: false

      - name: Check out claude-delegator v3.5.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mateusz-klatt/claude-delegator
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          persist-credentials: false

      - name: Install the baseline runtime dependencies
        working-directory: baseline
        run: |
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 12)) throw Error("Node 22.12 or later required");'
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Build the release server and shared provider stub
        working-directory: proxenos
        run: |
          cargo build --locked --release --bin proxenos
          cargo build --locked --release --features test-tools --bin proxenos-stub

      - name: Build the comparison harness separately
        working-directory: harness
        run: |
          cargo build --locked --release --features test-tools --example comparison --bin proxenos-stub --target-dir "$RUNNER_TEMP/comparison-target"

      - name: Identify the runner and all measured programs
        working-directory: proxenos
        env:
          WORKFLOW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PROXENOS_SHA"
          test "$(git -C ../baseline rev-parse HEAD)" = "$BASELINE_SHA"
          test "$(git -C ../harness rev-parse HEAD)" = "$HARNESS_SHA"
          mkdir ../results
          {
            printf 'Run %s/%s/actions/runs/%s (attempt %s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Workflow head %s\nProxenos and stub %s\nComparison harness %s\nclaude-delegator %s\n' "$WORKFLOW_HEAD" "$PROXENOS_SHA" "$HARNESS_SHA" "$BASELINE_SHA"
            printf 'Runner image %s %s\n' "$ImageOS" "$ImageVersion"
            cat /etc/os-release
            uname -srmo
            lscpu
            rustc -Vv
            cargo -Vv
            printf 'Node %s at %s\nnpm %s\n' "$(node --version)" "$(realpath "$(command -v node)")" "$(npm --version)"
            sha256sum Cargo.lock ../harness/Cargo.lock ../baseline/package-lock.json ../baseline/package.json \
              ../baseline/server/{codex,agy}/index.js target/release/{proxenos,proxenos-stub} \
              "$(realpath "$(command -v node)")" "$RUNNER_TEMP/comparison-target/release/examples/comparison"
          } > ../results/provenance.txt

      - name: Measure four scenarios with the shared stub
        id: scenarios
        if: ${{ github.event_name == 'pull_request' || inputs.measurement != 'tree-cancel' }}
        working-directory: proxenos
        run: |
          "$RUNNER_TEMP/comparison-target/release/examples/comparison" \
            --proxenos-bin target/release/proxenos --stub-bin target/release/proxenos-stub \
            --delegator-dir ../baseline --node-bin "$(command -v node)" \
            --scenarios a,c,f,g --runs 10 --concurrency 4 --out-dir "$RUNNER_TEMP/comparison-output"
          # Retain every raw scenario trial. The historical report also contains a static feature table.
          jq '{schema_version, metadata, part1}' "$RUNNER_TEMP"/comparison-output/part1-*.json > ../results/scenarios.json

      - name: Report exact-answer, cleanup, error and reply counts
        if: ${{ steps.scenarios.outcome == 'success' }}
        run: |
          jq -e '(.metadata.mode == "part1-stubbed") and (.metadata.delegator_version == "3.5.0")
            and (.part1 | [.scenario_a_advisory, .scenario_c_cancel, .scenario_f_failures, .scenario_g_reply]
              | (map(length) == [4,4,16,4]) and all(.[][]; .trials | length == 10))' results/scenarios.json > /dev/null
          {
            echo '## Codex and Antigravity using the shared stub'
            echo
            echo '10 trials per target and case, in fixed target order. Foreground call timing begins after initialize and tools/list.'
            echo
            echo '| Server | Provider | Fixed answer intact / 10 | Foreground median (ms, all trials) |'
            echo '| --- | --- | ---: | ---: |'
            jq -r '.part1.scenario_a_advisory[] | "| \(.target.server) | \(.target.provider) | \(.intact_count) | \(.wall_ms.median) |"' results/scenarios.json
            echo
            echo '| Server | Provider | CLI gone at final check / initially observed | Grandchild gone at final check / initially observed |'
            echo '| --- | --- | ---: | ---: |'
            jq -r 'def count(f): [.trials[] | select(f)] | length;
              .part1.scenario_c_cancel[] | "| \(.target.server) | \(.target.provider) | \(count(.pre_cli_alive and .cli_gone_10s))/\(count(.pre_cli_alive)) | \(count(.pre_gc_alive and .gc_gone_10s))/\(count(.pre_gc_alive)) |"' results/scenarios.json
            echo
            echo '| Server | Provider | Injected case | Flagged as error / 10 | Recorded channel (first trial) |'
            echo '| --- | --- | --- | ---: | --- |'
            jq -r '.part1.scenario_f_failures[] | "| \(.target.server) | \(.target.provider) | \(.case) | \(.is_error_count) | \(.channel_sample) |"' results/scenarios.json
            echo
            echo '| Server | Provider | Bare reply with no RPC/tool error / 10 | Model carried / 10 | Working directory carried / 10 |'
            echo '| --- | --- | ---: | ---: | ---: |'
            jq -r '.part1.scenario_g_reply[] | "| \(.target.server) | \(.target.provider) | \(.bare_reply_succeeded_count) | \(.model_carried_count) | \(.cwd_carried_count) |"' results/scenarios.json
            echo
            echo 'Cancellation checks target 2 s and 10 s and can run later while waiting for a response. Injected errors and reply outcomes have different criteria; the artifact retains each recorded field.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scenario trials and provenance
        if: ${{ !cancelled() && steps.scenarios.outcome != 'skipped' && hashFiles('results/provenance.txt') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-provider-scenarios-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: error
          retention-days: 30

      - name: Measure cancellation with the tree-capable historical stub
        id: tree
        if: ${{ github.event_name == 'pull_request' || inputs.measurement != 'provider-scenarios' }}
        working-directory: proxenos
        run: |
          mkdir ../tree-results
          cp ../results/provenance.txt ../tree-results/provenance.txt
          {
            printf '\nCancellation follow-up provider stub from %s\n' "$HARNESS_SHA"
            sha256sum "$RUNNER_TEMP/comparison-target/release/proxenos-stub"
          } >> ../tree-results/provenance.txt
          "$RUNNER_TEMP/comparison-target/release/examples/comparison" \
            --proxenos-bin target/release/proxenos --stub-bin "$RUNNER_TEMP/comparison-target/release/proxenos-stub" \
            --delegator-dir ../baseline --node-bin "$(command -v node)" \
            --scenarios c --runs 10 --concurrency 4 --out-dir "$RUNNER_TEMP/tree-output"
          jq '{schema_version, metadata, scenario_c_cancel: .part1.scenario_c_cancel}' \
            "$RUNNER_TEMP"/tree-output/part1-*.json > ../tree-results/cancellation.json

      - name: Check the pre-cancel processes and report their survival
        if: ${{ steps.tree.outcome == 'success' }}
        run: |
          file=tree-results/cancellation.json
          {
            echo '## Cancellation with a CLI that spawns a grandchild'
            echo
            echo 'The historical stub starts a grandchild that ignores SIGTERM. Each count includes trials where both processes were observed before cancellation.'
            echo
            echo '| Server | Provider | Both observed / 10 | CLI still seen at 2 s / 10 s | Grandchild still seen at 2 s / 10 s |'
            echo '| --- | --- | ---: | ---: | ---: |'
            jq -r 'def present(f): [.trials[] | select(.pre_cli_alive and .pre_gc_alive and (f | not))] | length;
              .scenario_c_cancel[] | "| \(.target.server) | \(.target.provider) | \(.pre_verified_count) | \(present(.cli_gone_2s)) / \(present(.cli_gone_10s)) | \(present(.gc_gone_2s)) / \(present(.gc_gone_10s)) |"' "$file"
            echo
            echo 'The sampling instants are nominal. A late or missing response can delay a check. The harness cleans up surviving marked processes after observation.'
          } >> "$GITHUB_STEP_SUMMARY"
          jq -e '(.metadata.mode == "part1-stubbed") and (.metadata.delegator_version == "3.5.0")
            and (.scenario_c_cancel | length == 4 and all(.[]; (.trials | length == 10 and all(.[]; .pre_cli_alive and .pre_gc_alive))))' "$file" > /dev/null

      - name: Upload the separate tree-cancellation result
        if: ${{ !cancelled() && steps.tree.outcome != 'skipped' && hashFiles('tree-results/provenance.txt') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-tree-cancellation-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: tree-results/
          if-no-files-found: error
          retention-days: 30
