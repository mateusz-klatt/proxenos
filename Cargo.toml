[package]
name = "proxenos"
default-run = "proxenos"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
description = "MCP delegation between coding-agent CLIs"
license = "Apache-2.0"
repository = "https://github.com/mateusz-klatt/proxenos"
publish = false

[dependencies]
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-io"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.20"

[target.'cfg(unix)'.dependencies]
tokio = { version = "1.54.1", features = ["signal"] }
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# A stand-in for an agent CLI, for the tests (D12).
[[bin]]
name = "proxenos-stub"
path = "src/proxenos-stub.rs"
required-features = ["test-tools"]

[features]
# Extra tools that exist only to test the MCP layer through the compiled binary.
test-tools = []

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
print_stdout = "deny"
todo = "deny"
