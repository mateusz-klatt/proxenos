[package]
name = "proxenos"
default-run = "proxenos"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "MCP delegation between coding-agent CLIs"
license = "Apache-2.0"
repository = "https://github.com/mateusz-klatt/proxenos"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
uuid = { version = "1.29.3", features = ["v4"] }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-io"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.20"
toml_edit = "0.25.21"

[target.'cfg(unix)'.dependencies]
tokio = { version = "1.54.1", features = ["signal"] }
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# A stand-in for an agent CLI, for the tests (D12).
[[bin]]
name = "proxenos-stub"
path = "src/proxenos-stub.rs"
required-features = ["test-tools"]

# A developer tool for replaying the migration comparison in D12.
[[bin]]
name = "compare_init"
path = "src/compare_init.rs"
required-features = ["test-tools"]

[features]
# Tools for exercising the MCP layer and its migration comparison through compiled binaries.
test-tools = []

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
print_stdout = "deny"
todo = "deny"

[profile.release]
# Strip symbols and enable thin LTO for smaller release binaries while keeping
# panic = "unwind" so D4's handler panic-catching still unwinds cleanly.
strip = "symbols"
lto = "thin"
