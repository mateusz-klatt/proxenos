version: 2
project_name: proxenos

# D11: a version tag produces a draft GitHub release for the owner to publish.
# Snapshots never publish. The release workflow splits macOS and Linux/Windows
# across runners using PROXENOS_BUILD_GROUP and hands the macOS archives and
# SBOMs into checksums and release upload through PROXENOS_MACOS_DIST.
release:
  draft: true
  prerelease: auto
  extra_files:
    - glob: '{{ if isEnvSet "PROXENOS_MACOS_DIST" }}{{ .Env.PROXENOS_MACOS_DIST }}/*{{ end }}'

builds:
  - id: proxenos-darwin
    builder: rust
    binary: proxenos
    skip: '{{ eq (envOrDefault "PROXENOS_BUILD_GROUP" "all") "linux-windows" }}'
    targets:
      - x86_64-apple-darwin
      - aarch64-apple-darwin
    flags:
      - --release
      - --locked

  - id: proxenos
    builder: rust
    binary: proxenos
    skip: '{{ eq (envOrDefault "PROXENOS_BUILD_GROUP" "all") "darwin" }}'
    targets:
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
      - x86_64-pc-windows-gnu
      - aarch64-pc-windows-gnullvm
    flags:
      - --release
      - --locked
    env:
      # Zig's Windows ARM64 GNU wrapper does not add libunwind automatically from
      # rustc's --unwindlib=libunwind; link it explicitly for panic unwinding (D4).
      - CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_RUSTFLAGS=-C link-arg=-lunwind
    hooks:
      post:
        # On a real tag release, sign each Windows executable before archiving,
        # checksumming and cosign. Snapshots stay unsigned. No secret value is
        # templated into argv; the child receives only the five allowlisted
        # environment variables and no standard I/O.
        - cmd: |-
            {{ if and (eq .Os "windows") (not .IsSnapshot) -}}
            python3 -c '
            import os, stat, subprocess, sys
            path = sys.argv[1]
            signer = os.environ.get("PROXENOS_WINDOWS_SIGNER", "")
            runtime_dir = os.environ.get("XDG_RUNTIME_DIR", "")
            if not (os.path.isabs(signer) and os.path.isabs(runtime_dir) and os.environ.get("CERTUM_EMAIL") and os.environ.get("CERTUM_OTP")):
                sys.exit("Windows signing configuration is incomplete")
            if not (not os.path.islink(signer) and not os.path.islink(path) and stat.S_ISREG(os.stat(signer).st_mode) and stat.S_ISREG(os.stat(path).st_mode)):
                sys.exit("Windows signing input is unavailable")
            os.chmod(signer, 0o700)
            cache_dir = os.path.join(runtime_dir, "ssign")
            os.makedirs(cache_dir, mode=0o700, exist_ok=True)
            os.chmod(cache_dir, 0o700)
            env = {k: os.environ.get(k, "") for k in ("CERTUM_EMAIL", "CERTUM_OTP", "XDG_RUNTIME_DIR", "HOME", "PATH")}
            try:
                res = subprocess.run([signer, path], env=env, stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=300)
            except subprocess.TimeoutExpired:
                sys.exit("Windows signing deadline exceeded")
            if res.returncode != 0:
                sys.exit("Windows signing failed")
            ' "{{ .Path }}"
            {{- end }}

archives:
  - id: proxenos
    ids:
      - proxenos
      - proxenos-darwin
    name_template: 'proxenos_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # Fixed ownership and commit timestamp avoid recording builder identity.
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: '{{ .CommitDate }}'
    files:
      - src: LICENSE
        info: &fixed
          owner: root
          group: root
          mode: 0644
          mtime: '{{ .CommitDate }}'
      - src: NOTICE
        info: *fixed

# Developer ID signing and Apple notarization. Disabled when MACOS_SIGN_P12 is
# unset or empty, so local and PR snapshots run without credentials.
notarize:
  macos:
    - ids:
        - proxenos-darwin
      enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: '{{ .Env.MACOS_SIGN_P12 }}'
        password: '{{ envOrDefault "MACOS_SIGN_PASSWORD" "" }}'
      notarize:
        issuer_id: '{{ envOrDefault "MACOS_NOTARY_ISSUER_ID" "" }}'
        key_id: '{{ envOrDefault "MACOS_NOTARY_KEY_ID" "" }}'
        key: '{{ envOrDefault "MACOS_NOTARY_KEY" "" }}'
        wait: true
        timeout: 20m

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: '{{ if isEnvSet "PROXENOS_MACOS_DIST" }}{{ .Env.PROXENOS_MACOS_DIST }}/*{{ end }}'

sboms:
  - artifacts: archive
    cmd: syft

signs:
  - artifacts: checksum
    cmd: cosign
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - '--yes'
