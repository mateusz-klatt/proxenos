sonar.projectKey=mateusz-klatt_proxenos
sonar.organization=mateusz-klatt

# Analyse every checked-out file. The test inclusions below classify tests without
# narrowing the source surface.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**

# Line coverage from cargo-llvm-cov on the Linux job. CI holds every platform to 100% for the
# code that platform compiles; SonarCloud sees the Linux profile only.
sonar.rust.lcov.reportPaths=lcov.info
